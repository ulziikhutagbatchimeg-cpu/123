<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limewater Test Simulator</title>
<style>
/* Layout: apparatus bench on the left, controls on the right; observations, equations and results below. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --ink:#1d2a33; --muted:#5b6b76; --line:#cdd7dd;
  --accent:#2457b8; --accent-soft:#e3ebfa;
  --warn:#b4471d; --warn-soft:#fbe9e1; --ok:#1f7a55; --ok-soft:#e1f3ea;
  --glass:#7d97a6; --glass-fill:rgba(190,220,235,.28); --bench:#c9b79c; --metal:#6f7c85; --metal-dark:#4b555c;
  --lime:#d8eef5; --rubber:#8a5a3b;
  --font-display:"Literata", Georgia, serif;
  --font-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11171c; --surface:#1a2229; --ink:#e4ebef; --muted:#9aaab5; --line:#2e3a43;
    --accent:#7ea6ff; --accent-soft:#1f2c47; --warn:#ff9a6e; --warn-soft:#3a2219; --ok:#5fd3a0; --ok-soft:#163327;
    --glass:#9fb8c6; --glass-fill:rgba(160,200,220,.12); --bench:#5a4c3a; --metal:#8c99a2; --metal-dark:#6c7880;
    --lime:#2b4552; --rubber:#9b6b4a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11171c; --surface:#1a2229; --ink:#e4ebef; --muted:#9aaab5; --line:#2e3a43;
  --accent:#7ea6ff; --accent-soft:#1f2c47; --warn:#ff9a6e; --warn-soft:#3a2219; --ok:#5fd3a0; --ok-soft:#163327;
  --glass:#9fb8c6; --glass-fill:rgba(160,200,220,.12); --bench:#5a4c3a; --metal:#8c99a2; --metal-dark:#6c7880;
  --lime:#2b4552; --rubber:#9b6b4a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body)}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:16px}
/* On a narrow screen every part shrinks to the width, so nothing runs off the side */
.wrap{grid-template-columns:minmax(0,1fr)} .wrap>*,.main>*,.grid2>*{min-width:0}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
h1{font:600 clamp(1.3rem,2.6vw,1.8rem)/1.2 var(--font-display);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;max-width:70ch}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:var(--surface);color:var(--ink);padding:6px 12px;font:500 13px var(--font-body);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:#fff}
.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h2{font:600 13px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
figure{margin:0}
.bench svg{width:100%;height:auto;display:block}
.status{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
@media (max-width:560px){.status{grid-template-columns:repeat(2,1fr)}}
.stat{border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.stat b{display:block;font:500 17px var(--font-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font:500 13px var(--font-body)}
.pill.clear{background:var(--accent-soft);color:var(--accent)}
.pill.milky{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.ctrl{display:grid;gap:14px}
.subs{display:grid;gap:6px}
.subs label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer}
.subs input{accent-color:var(--accent)}
.subs label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.swatch{width:16px;height:16px;border-radius:4px;border:1px solid var(--line);flex:none}
.subs small{display:block;color:var(--muted);font-family:var(--font-mono);font-size:12px}
.btns{display:grid;gap:8px}
button.act{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 12px;font:500 14px var(--font-body);cursor:pointer;text-align:left}
button.act:hover{border-color:var(--accent)}
button.act.on{background:var(--accent);border-color:var(--accent);color:#fff}
button.act.danger{border-color:var(--warn);color:var(--warn)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row button.act{flex:1;text-align:center;padding:7px}
.alert{border-radius:8px;padding:10px 12px;background:var(--warn-soft);color:var(--warn);font-weight:500;display:none}
.alert.show{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
ol.log{margin:0;padding:0;list-style:none;display:grid;gap:6px;max-height:260px;overflow:auto}
ol.log li{display:grid;grid-template-columns:52px 1fr;gap:8px;font-size:14px}
ol.log time{font:500 13px var(--font-mono);color:var(--muted)}
ol.log li.key{color:var(--ok);font-weight:500}
ol.log li.bad{color:var(--warn);font-weight:500}
.eq{font:15px/1.7 var(--font-mono);overflow-x:auto}
.eq p{margin:0 0 6px}
.eq .note{font:13px var(--font-body);color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
ol.steps{margin:0;padding-left:20px;display:grid;gap:4px}
ol.steps li.safety{color:var(--warn)}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="t-title"></h1>
      <p class="sub" id="t-sub"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button id="lang-mn" aria-pressed="true">Монгол</button>
      <button id="lang-en" aria-pressed="false">English</button>
    </div>
  </header>

  <div class="main">
    <section class="panel bench">
      <figure>
        <svg id="rig" viewBox="0 110 860 410" role="img" aria-label="Boiling tube with solid, heated by a Bunsen burner; a delivery tube leads the gas into limewater in a test tube.">
          <defs>
            <linearGradient id="gYellow" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0" stop-color="#ffd257"/><stop offset=".55" stop-color="#ffb02e"/><stop offset="1" stop-color="#ff7a1a" stop-opacity=".2"/>
            </linearGradient>
            <linearGradient id="gBlue" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0" stop-color="#3a6cff"/><stop offset=".7" stop-color="#6fa0ff" stop-opacity=".7"/><stop offset="1" stop-color="#9fc0ff" stop-opacity=".1"/>
            </linearGradient>
            <radialGradient id="gGlow"><stop offset="0" stop-color="#ff5a1f" stop-opacity=".55"/><stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/></radialGradient>
          </defs>
          <!-- bench -->
          <rect x="0" y="500" width="860" height="20" fill="var(--bench)"/>
          <!-- clamp stand -->
          <rect x="330" y="486" width="150" height="14" rx="3" fill="var(--metal-dark)"/>
          <rect x="412" y="120" width="8" height="368" fill="var(--metal)"/>
          <rect x="404" y="210" width="24" height="22" rx="3" fill="var(--metal-dark)"/>
          <rect x="380" y="217" width="32" height="7" fill="var(--metal)"/>
          <!-- burner -->
          <g id="burner">
            <path d="M120 498 Q 140 470 175 474" fill="none" stroke="#e0a14a" stroke-width="7" stroke-linecap="round"/>
            <rect x="178" y="482" width="64" height="16" rx="4" fill="var(--metal-dark)"/>
            <rect x="200" y="365" width="20" height="120" fill="var(--metal)"/>
            <rect id="collar" x="197" y="440" width="26" height="16" rx="2" fill="var(--metal-dark)"/>
            <rect id="airhole" x="206" y="444" width="8" height="8" rx="1" fill="#1b1b1b"/>
            <g id="flame" transform="translate(210 365)"></g>
          </g>
          <!-- boiling tube group (rotated so the mouth points slightly down) -->
          <g id="btube" transform="translate(150 245) rotate(5)">
            <ellipse id="glow" cx="60" cy="18" rx="70" ry="30" fill="url(#gGlow)" opacity="0"/>
            <path d="M22 -22 H285 V22 H22 A22 22 0 0 1 22 -22 Z" fill="var(--glass-fill)" stroke="var(--glass)" stroke-width="2.5"/>
            <path id="solid" d="" stroke="rgba(0,0,0,.25)" stroke-width="1"/>
            <g id="drops"></g>
            <g id="crack" opacity="0" stroke="var(--warn)" stroke-width="2" fill="none">
              <path d="M70 -22 l8 12 l-6 8 l10 10 l-5 14"/><path d="M110 22 l-6 -10 l8 -6"/>
            </g>
            <path d="M262 -25 L300 -20 L300 20 L262 25 Z" fill="var(--rubber)"/>
            <g id="clamp" fill="var(--metal-dark)">
              <rect x="222" y="-38" width="10" height="20" rx="2"/>
              <rect x="214" y="-31" width="26" height="9" rx="4" fill="#3b3b3b"/>
              <rect x="214" y="22" width="26" height="9" rx="4" fill="#3b3b3b"/>
              <rect x="236" y="-31" width="5" height="62" rx="2"/>
            </g>
          </g>
          <!-- delivery tube -->
          <path id="dtube" d="" fill="none" stroke="var(--glass)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
          <path id="dtubeIn" d="" fill="none" stroke="var(--surface)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path id="suck" d="" fill="none" stroke="var(--lime)" stroke-width="5" stroke-linecap="round"/>
          <!-- test tube with limewater -->
          <g id="ttube">
            <rect x="630" y="430" width="110" height="12" rx="2" fill="var(--metal-dark)"/>
            <rect x="636" y="442" width="8" height="58" fill="var(--metal-dark)"/>
            <rect x="726" y="442" width="8" height="58" fill="var(--metal-dark)"/>
            <path id="lime" d="" />
            <g id="bubbles"></g>
            <path d="M658 295 V468 A22 22 0 0 0 702 468 V295" fill="none" stroke="var(--glass)" stroke-width="2.5"/>
          </g>
          <!-- labels -->
          <g id="labels" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="currentColor" style="color:var(--ink)">
            <g stroke="var(--muted)" stroke-width="1"><line x1="195" y1="258" x2="160" y2="160"/><line x1="300" y1="246" x2="300" y2="160"/><line x1="445" y1="250" x2="470" y2="190"/><line x1="560" y1="263" x2="560" y2="300"/><line x1="702" y1="420" x2="770" y2="420"/><line x1="220" y1="400" x2="300" y2="400"/><line x1="420" y1="160" x2="450" y2="140"/><line x1="378" y1="292" x2="378" y2="306"/><line x1="224" y1="448" x2="300" y2="462"/></g>
            <text x="160" y="152" text-anchor="middle" id="L-solid"></text>
            <text x="300" y="152" text-anchor="middle" id="L-btube"></text>
            <text x="472" y="184" id="L-bung"></text>
            <text x="560" y="316" text-anchor="middle" id="L-dtube"></text>
            <text x="774" y="424" id="L-lime"></text>
            <text x="304" y="404" id="L-burner"></text>
            <text x="454" y="138" id="L-stand"></text>
            <text x="404" y="322" text-anchor="end" id="L-clamp"></text>
            <text x="304" y="466" id="L-air"></text>
          </g>
        </svg>
        <figcaption class="sub" id="t-caption"></figcaption>
      </figure>
      <div class="status" aria-live="polite">
        <div class="stat"><b id="s-time">00:00</b><span id="t-s-time"></span></div>
        <div class="stat"><b id="s-temp">25 °C</b><span id="t-s-temp"></span></div>
        <div class="stat"><b id="s-dec">0 %</b><span id="t-s-dec"></span></div>
        <div class="stat"><b id="s-lime"><span class="pill clear">—</span></b><span id="t-s-lime"></span></div>
      </div>
    </section>

    <aside class="panel ctrl">
      <div>
        <h2 id="t-h-sub"></h2>
        <div class="subs" id="subs"></div>
      </div>
      <div class="btns">
        <h2 id="t-h-ctrl" style="margin:0"></h2>
        <button class="act" id="b-burner"></button>
        <button class="act" id="b-air"></button>
        <button class="act" id="b-tube"></button>
        <div class="row" role="group" aria-label="Speed">
          <button class="act" data-speed="1">×1</button>
          <button class="act on" data-speed="4">×4</button>
          <button class="act" data-speed="10">×10</button>
        </div>
        <button class="act" id="b-reset"></button>
        <label class="chk"><input type="checkbox" id="c-labels" checked> <span id="t-labels"></span></label>
      </div>
      <div class="alert" id="alert" role="alert"></div>
    </aside>
  </div>

  <div class="grid2">
    <section class="panel">
      <h2 id="t-h-log"></h2>
      <ol class="log" id="log"></ol>
    </section>
    <section class="panel">
      <h2 id="t-h-eq"></h2>
      <div class="eq" id="eq"></div>
    </section>
  </div>

  <section class="panel">
    <h2 id="t-h-res"></h2>
    <div class="tablewrap">
      <table>
        <thead><tr><th id="t-c1"></th><th id="t-c2"></th><th id="t-c3"></th><th id="t-c4"></th><th id="t-c5"></th></tr></thead>
        <tbody id="res"></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <h2 id="t-h-method"></h2>
    <ol class="steps" id="steps"></ol>
  </section>
</div>

  s_time:'хугацаа', s_temp:'бодис (ойролцоо)', s_dec:'задарсан', s_lime:'шохойн ус',
  h_sub:'Буцалгах хоолой дахь бодис', h_ctrl:'Удирдлага', burnOn:'Горелк асаах', burnOff:'Горелк унтраах',
  airC:'Агаарын нүх хаалттай · шар дөл', airO:'Агаарын нүх нээлттэй · цэнхэр дөл', tubeIn:'Гаргах хоолойг шохойн усанд дүрэх', tubeOut:'Гаргах хоолойг шохойн уснаас гаргах',
  reset:'Багажийг шинэчлэх', labels:'Нэрийг харуулах', h_log:'Ажиглалт', h_eq:'Тэгшитгэл', h_res:'Үр дүнгийн хүснэгт', h_method:'Арга ба аюулгүй ажиллагаа',
  c1:'Бодис', c2:'Өнгөний өөрчлөлт', c3:'Шохойн ус', c4:'Цайх хугацаа', c5:'Дүгнэлт',
  L:{solid:'хатуу бодис', btube:'буцалгах хоолой', bung:'бөглөө', dtube:'гаргах хоолой', lime:'шохойн ус', burner:'Бунзен горелк', stand:'штатив', air:'агаарын нүх', clamp:'хавчаар (амсар орчим)'},
  lime:{clear:'тунгалаг', cloudy:'бага зэрэг булингартсан', milky:'цайсан (сүү шиг)', clearAgain:'дахин тунгалаг'},
  limeEq:'Ca(OH)₂(aq) + CO₂(g) → CaCO₃(s) + H₂O(l)', limeEq2:'CO₂ илүүдэлтэй үед: CaCO₃(s) + CO₂(g) + H₂O(l) → Ca(HCO₃)₂(aq)',
  limeNote:'CaCO₃-ийн цагаан тунадас шохойн усыг цайлгана. Ca(HCO₃)₂ уусдаг тул илүүдэл CO₂-оор дахин тунгалаг болно.',
  ev:{lit:'Горелк асаалаа.', off:'Горелк унтраалаа.', yellow:'Агаарын нүх хаалттай: шар, гэрэлтэй дөл (хүйтэвтэр, хөө тортог үүсгэнэ).', blue:'Агаарын нүх нээлттэй: цэнхэр, хүчтэй дөл (халуун).',
   into:'Гаргах хоолойг шохойн усанд дүрлээ.', out:'Гаргах хоолойг шохойн уснаас гаргалаа.', airBub:'Бөмбөлөг гарч эхэллээ. Эхний хий нь хоолой доторх тэлсэн агаар.',
   co2Bub:'Хий шохойн усаар тасралтгүй бөмбөлөгдөж байна.', cloudy:'Шохойн ус булингартаж эхэллээ.', milky:'Шохойн ус цайлаа — хий нь нүүрстөрөгчийн давхар исэл.',
   clearAgain:'CO₂ илүүдэлтэй тул шохойн ус дахин тунгалаг боллоо.', colour:'Бодисын өнгө өөрчлөгдлөө: ', drops:'Хоолойн хүйтэн үзүүрт өнгөгүй дусал конденсацлагдлаа.',
   done:'Хий ялгарахаа больсон — задрал дууслаа.', noChange:'Хүчтэй халаасан ч өөрчлөлт алга, шохойн ус тунгалаг хэвээр.',
   escape:'Гаргах хоолой шохойн усанд ороогүй тул хий агаарт алдагдаж байна.',
   suckWarn:'Анхаар: хий хөрж агшиж байна. Шохойн ус гаргах хоолойгоор буцаж сорогдож байна! Хоолойг гарга.',
   cracked:'Буцаж сорогдлоо! Хүйтэн шохойн ус халуун хоолойд хүрлээ. Бодит лабораторид шил хагарч болно. «Багажийг шинэчлэх»-ийг дар.',
   slow:'Энэ температурт бодис маш удаан задарч байна.'},
  pos:'CO₂ ялгарсан', neg:'CO₂ ялгараагүй (задрахгүй)',
  steps:['Хуурай буцалгах хоолойд нэг халбага бодис хийж, ёроолоор нь тараа.',
   'Хоолойг амсар орчмоос нь бэхэлж, амсрыг бага зэрэг доош хазайлга. Бөглөө ба гаргах хоолойг суулга.',
   'Туршуурын хоолойд ≈2 см³ шохойн ус хийж, гаргах хоолойн үзүүрийг дүр.',
   'Горелкийг агаарын нүх хаалттай асаагаад дараа нь нүхийг нээ. Бодисыг хүчтэй халааж, дөлийг зөөлөн хөдөлгө.',
   'Бодис ба шохойн усны өнгөний өөрчлөлт, цайх хугацааг тэмдэглэ.',
   'Аюулгүй ажиллагаа: халаалтаа зогсоохоос ӨМНӨ гаргах хоолойг шохойн уснаас ГАРГА — буцаж сорогдохоос сэргийлнэ.',
   'Аюулгүй ажиллагаа: хамгаалалтын нүдний шил зүү; хоолойн амсрыг хүн рүү бүү чиглүүл; халуун шилийг халуунд тэсвэртэй дэвсгэр дээр хөргө.']}
};
// The site opens the lab in the lesson's language: #en for English, otherwise Mongolian
let lang=location.hash.replace('#','').startsWith('en')?'en':'mn';
const $=id=>document.getElementById(id);
const SVGNS='http://www.w3.org/2000/svg';
const ORIGIN={x:150,y:245}, ANG=5*Math.PI/180;
const toG=(x,y)=>({x:ORIGIN.x+x*Math.cos(ANG)-y*Math.sin(ANG), y:ORIGIN.y+x*Math.sin(ANG)+y*Math.cos(ANG)});
const OUT=toG(300,0);
const LIME_TOP=360, TIP_IN=452, TIP_OUT=330, TX=680;

let S, results={};
function fresh(sub){
  return {sub, t:0, lit:false, blue:false, tubeIn:true, tip:TIP_IN, T:25, dTdt:0, conv:0, c:1, p:0, dis:0,
    bubAcc:0, suck:0, cracked:false, water:0, everHeated:false, heatTime:0, fired:{}, milkyAt:null, maxP:0};
}
function cap(){return 22;} // mL CO2 needed to precipitate all Ca(OH)2 (arbitrary units)

// --------- drawing helpers ----------
function solidPath(){
  // heap along the bottom of the boiling tube (local coords)
  return 'M10 22 Q 8 6 30 4 Q 70 0 110 8 Q 130 12 136 22 Z';
}
function mix(a,b,f){
  const pa=[1,3,5].map(i=>parseInt(a.substr(i,2),16)), pb=[1,3,5].map(i=>parseInt(b.substr(i,2),16));
  return '#'+pa.map((v,i)=>Math.round(v+(pb[i]-v)*f).toString(16).padStart(2,'0')).join('');
}
function solidColour(){
  const d=SUBS[S.sub]; let col=mix(d.start,d.end,Math.min(1,S.conv));
  if(d.hot){ const h=Math.max(0,Math.min(1,(S.T-200)/200))*Math.min(1,S.conv*1.5); col=mix(col,d.hot,h); }
  return col;
}
function deliveryPath(){
  return `M${OUT.x.toFixed(1)} ${OUT.y.toFixed(1)} L655 ${OUT.y.toFixed(1)} Q ${TX} ${OUT.y.toFixed(1)} ${TX} ${(OUT.y+25).toFixed(1)} L${TX} ${S.tip.toFixed(1)}`;
}
function limePath(){
  return `M660 ${LIME_TOP} V468 A20 20 0 0 0 700 468 V${LIME_TOP} Z`;
}
function flameShape(){
  const g=$('flame'); g.innerHTML='';
  if(!S.lit) return;
  const j=()=> (Math.random()-.5)*4;
  const p=document.createElementNS(SVGNS,'path');
  if(S.blue){
    p.setAttribute('d',`M-10 0 Q -12 -40 ${j()} -${88+j()} Q 12 -40 10 0 Z`); p.setAttribute('fill','url(#gBlue)');
    const c=document.createElementNS(SVGNS,'path'); c.setAttribute('d','M-6 0 Q -5 -18 0 -34 Q 5 -18 6 0 Z'); c.setAttribute('fill','#7fd3ff'); c.setAttribute('opacity','.85');
    g.append(p,c);
  } else {
    p.setAttribute('d',`M-12 0 Q -22 -45 ${-4+j()} -${110+j()*2} Q 6 -70 ${14+j()} -${120+j()} Q 22 -50 12 0 Z`); p.setAttribute('fill','url(#gYellow)');
    g.append(p);
  }
}
let bubbles=[];
function spawnBubble(){ if(!S.tubeIn||S.cracked) return; bubbles.push({x:TX+(Math.random()-.5)*6, y:S.tip, r:2.5+Math.random()*2.5}); }
function drawBubbles(dt){
  const g=$('bubbles'); g.innerHTML='';
  bubbles.forEach(b=>{ b.y-=60*dt; b.x+=(Math.random()-.5)*1.2; });
  bubbles=bubbles.filter(b=>b.y>LIME_TOP+2);
  bubbles.forEach(b=>{ const c=document.createElementNS(SVGNS,'circle'); c.setAttribute('cx',b.x); c.setAttribute('cy',b.y); c.setAttribute('r',b.r); c.setAttribute('fill','none'); c.setAttribute('stroke','var(--glass)'); c.setAttribute('stroke-width','1.4'); g.append(c); });
}
function drawDrops(){
  const g=$('drops'); g.innerHTML='';
  const n=Math.min(14,Math.floor(S.water/1.5));
  for(let i=0;i<n;i++){ const c=document.createElementNS(SVGNS,'circle'); const x=205+((i*37)%55), y=-16+((i*23)%30);
    c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('r',2+(i%3)*.6); c.setAttribute('fill','rgba(170,210,235,.85)'); c.setAttribute('stroke','var(--glass)'); c.setAttribute('stroke-width','.6'); g.append(c); }
}
function limeState(){
  const t=S.p/cap();
  if(S.c<=0.001 && S.maxP>0.6*cap() && t<0.25) return 'clearAgain';
  if(t>=0.6) return 'milky';
  if(t>=0.2) return 'cloudy';
  return 'clear';
}
function draw(dt){
  $('solid').setAttribute('d',solidPath());
  $('solid').setAttribute('fill',solidColour());
  const dp=deliveryPath();
  $('dtube').setAttribute('d',dp); $('dtubeIn').setAttribute('d',dp);
  // suck-back liquid along the tube from the tip
  const sp=$('suck');
  const rev=`M${TX} ${S.tip.toFixed(1)} L${TX} ${(OUT.y+25).toFixed(1)} Q ${TX} ${OUT.y.toFixed(1)} 655 ${OUT.y.toFixed(1)} L${OUT.x.toFixed(1)} ${OUT.y.toFixed(1)}`;
  sp.setAttribute('d',rev);
  const L=sp.getTotalLength(); sp.setAttribute('stroke-dasharray',`${(L*S.suck).toFixed(1)} ${L+10}`); sp.style.opacity=S.suck>0.01?1:0;
  // limewater
  const lp=$('lime'); lp.setAttribute('d',limePath());
  const turb=Math.max(0,Math.min(1,S.p/cap()));
  lp.setAttribute('fill',`color-mix(in srgb, var(--lime) ${Math.round((1-turb)*100)}%, #f3f3ef)`);
  lp.setAttribute('opacity',(0.75+0.25*turb).toFixed(2));
  // glow
  $('glow').setAttribute('opacity',Math.max(0,Math.min(.9,(S.T-250)/600)).toFixed(2));
  $('crack').setAttribute('opacity',S.cracked?1:0);
  // air hole
  $('airhole').setAttribute('fill',S.blue?'#1b1b1b':'var(--metal-dark)');
  $('airhole').setAttribute('width',S.blue?8:2); $('airhole').setAttribute('x',S.blue?206:209);
  flameShape(); drawBubbles(dt); drawDrops();
  // status
  const m=Math.floor(S.t/60), s=Math.floor(S.t%60);
  $('s-time').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  $('s-temp').textContent=`${Math.round(S.T)} °C`;
  $('s-dec').textContent=SUBS[S.sub].k?`${Math.round(S.conv*100)} %`:'0 %';
  const ls=limeState(); const cls=ls==='milky'?'milky':(ls==='cloudy'?'milky':'clear');
  $('s-lime').innerHTML=`<span class="pill ${cls}">${T[lang].lime[ls]}</span>`;
}

// --------- simulation ----------
function log(key,extra,kind,repeat){
  if(S.fired[key] && !repeat) return; S.fired[key]=true;
  const li=document.createElement('li'); if(kind) li.className=kind;
  const m=Math.floor(S.t/60), s=Math.floor(S.t%60);
  li.innerHTML=`<time>${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</time><span data-ev="${key}">${T[lang].ev[key]}${extra||''}</span>`;
  li.dataset.extra=extra||''; $('log').prepend(li);
}
function step(dt){
  if(S.cracked){ return; }
  S.t+=dt;
  const d=SUBS[S.sub];
  const target=S.lit?(S.blue?850:450):25, tau=S.lit?14:30;
  const T0=S.T; S.T+= (target-S.T)*(1-Math.exp(-dt/tau)); S.dTdt=(S.T-T0)/dt;
  if(S.lit){ S.everHeated=true; if(S.T>380) S.heatTime+=dt; }
  // decomposition
  let rate=0;
  if(d.k && S.T>d.thr && S.conv<1){ rate=d.k*Math.min(2,(S.T-d.thr)/150)*(1-S.conv); S.conv=Math.min(1,S.conv+rate*dt); }
  const co2=rate*dt*40;          // mL CO2 this step (arbitrary)
  if(d.h2o) S.water+=rate*dt*25;
  const air=40*S.dTdt*dt/(S.T+273); // mL air expansion (+) or contraction (-)
  const flow=co2+air;
  // limewater chemistry
  if(S.tubeIn && co2>0){
    let x=co2;
    if(S.c>0){ const used=Math.min(S.c*cap(),x); S.c-=used/cap(); S.p+=used; x-=used; }
    if(x>0){ const r=Math.min(S.p,x*0.6); S.p-=r; }
  }
  S.maxP=Math.max(S.maxP,S.p);
  // bubbles
  if(flow>0 && S.tubeIn){ S.bubAcc+=flow; while(S.bubAcc>0.35){ S.bubAcc-=0.35; spawnBubble(); } }
  // suck-back
  if(S.tubeIn && flow<0 && S.T>60){ S.suck=Math.min(1,S.suck+(-flow)*0.05); }
  else if(!S.tubeIn){ S.suck=Math.max(0,S.suck-dt*0.8); }
  if(S.suck>0.15) log('suckWarn',null,'bad');
  if(S.suck>=1){ S.cracked=true; log('cracked',null,'bad'); showAlert(T[lang].ev.cracked); }
  // events
  if(flow>0.02 && S.tubeIn && S.T>40) log('airBub');
  if(!S.tubeIn && co2>0.05) log('escape');
  if(co2>0.05 && S.tubeIn) log('co2Bub');
  const ls=limeState();
  if(ls==='cloudy') log('cloudy',null,'key');
  if(ls==='milky'){ log('milky',null,'key'); if(S.milkyAt===null) S.milkyAt=S.t; }
  if(ls==='clearAgain') log('clearAgain',null,'key');
  if((S.sub==='cuco3'||S.sub==='znco3') && S.conv>0.3) log('colour',' '+d[lang].c,'key');
  if(d.h2o && S.water>3) log('drops',null,'key');
  if(d.k && S.conv>0.985) log('done');
  if(S.sub==='caco3' && S.lit && !S.blue && S.T>420 && S.t>40) log('slow');
  if(S.sub==='na2co3' && S.heatTime>45) log('noChange',null,'key');
  record();
}
function record(){
  const d=SUBS[S.sub]; const r=results[S.sub]||{};
  if(S.everHeated){
    r.seen=true;
    if(d.k) r.colour=(S.conv>0.3||S.sub==='nahco3'||S.sub==='caco3')?d[lang].c:r.colour;
    if(S.maxP>0.6*cap()) r.milky=true;
    if(S.milkyAt!==null && r.time==null) r.time=S.milkyAt;
    if(S.sub==='na2co3' && S.heatTime>45) r.none=true;
    results[S.sub]=r; renderResults();
  }
}
function renderResults(){
  const tb=$('res'); tb.innerHTML='';
  ORDER.forEach(k=>{
    const d=SUBS[k], r=results[k]; const tr=document.createElement('tr');
    const fmt=t=>t==null?'—':`${Math.floor(t/60)} min ${Math.round(t%60)} s`;
    let lime='—', concl='—', col='—';
    if(r&&r.seen){
      col=k==='na2co3'?(r.none?d[lang].c:'…'):(r.colour||'…');
      lime=r.milky?T[lang].lime.milky:(r.none?T[lang].lime.clear:'…');
      concl=r.milky?T[lang].pos:(r.none?T[lang].neg:'…');
    }
    tr.innerHTML=`<td>${d[lang].n} <small style="color:var(--muted)">${d.f}</small></td><td>${col}</td><td>${lime}</td><td class="num">${r&&r.seen?fmt(r.time):'—'}</td><td>${concl}</td>`;
    tb.append(tr);
  });
}
function showAlert(msg){ const a=$('alert'); a.textContent=msg; a.classList.add('show'); }

// --------- UI ----------
function renderSubs(){
  const box=$('subs'); box.innerHTML='';
  ORDER.forEach(k=>{ const d=SUBS[k];
    const id='sub-'+k; const lab=document.createElement('label'); lab.setAttribute('for',id);
    lab.innerHTML=`<input type="radio" name="sub" id="${id}" value="${k}" ${S.sub===k?'checked':''}><span class="swatch" style="background:${d.start}"></span><span>${d[lang].n}<small>${d.f}</small></span>`;
    lab.querySelector('input').addEventListener('change',()=>{ reset(k); });
    box.append(lab); });
}
function renderEq(){
  const d=SUBS[S.sub];
  $('eq').innerHTML=`<p>${d.eq}</p><p class="note">${d[lang].note}</p><p>${T[lang].limeEq}</p><p>${T[lang].limeEq2}</p><p class="note">${T[lang].limeNote}</p>`;
}
function renderText(){
  const t=T[lang]; document.documentElement.lang=lang==='mn'?'mn':'en';
  $('t-title').textContent=t.title; $('t-sub').textContent=t.sub; $('t-caption').textContent=t.caption;
  $('t-s-time').textContent=t.s_time; $('t-s-temp').textContent=t.s_temp; $('t-s-dec').textContent=t.s_dec; $('t-s-lime').textContent=t.s_lime;
  $('t-h-sub').textContent=t.h_sub; $('t-h-ctrl').textContent=t.h_ctrl; $('b-reset').textContent=t.reset; $('t-labels').textContent=t.labels;
  $('t-h-log').textContent=t.h_log; $('t-h-eq').textContent=t.h_eq; $('t-h-res').textContent=t.h_res; $('t-h-method').textContent=t.h_method;
  ['c1','c2','c3','c4','c5'].forEach(c=>$('t-'+c).textContent=t[c]);
  Object.entries(t.L).forEach(([k,v])=>$('L-'+k).textContent=v);
  $('steps').innerHTML=t.steps.map((s,i)=>`<li class="${i>=5?'safety':''}">${s}</li>`).join('');
  document.querySelectorAll('#log span[data-ev]').forEach(sp=>{ const li=sp.parentElement; sp.textContent=t.ev[sp.dataset.ev]+(li.dataset.extra||''); });
  $('lang-mn').setAttribute('aria-pressed',lang==='mn'); $('lang-en').setAttribute('aria-pressed',lang==='en');
  renderButtons(); renderSubs(); renderEq(); renderResults();
}
function renderButtons(){
  const t=T[lang];
  $('b-burner').textContent=S.lit?t.burnOff:t.burnOn; $('b-burner').classList.toggle('on',S.lit);
  $('b-air').textContent=S.blue?t.airO:t.airC; $('b-air').classList.toggle('on',S.blue);
  $('b-tube').textContent=S.tubeIn?t.tubeOut:t.tubeIn; $('b-tube').classList.toggle('danger',S.tubeIn && S.lit===false && S.T>60);
  ['b-burner','b-air','b-tube'].forEach(id=>$(id).disabled=S.cracked);
}
function reset(sub){
  S=fresh(sub||S.sub); bubbles=[]; $('log').innerHTML=''; $('alert').classList.remove('show');
  renderButtons(); renderEq(); renderSubs(); draw(0);
}
$('b-burner').onclick=()=>{ S.lit=!S.lit; log(S.lit?'lit':'off','','',true); if(S.lit) log(S.blue?'blue':'yellow','','',true); renderButtons(); };
$('b-air').onclick=()=>{ S.blue=!S.blue; if(S.lit) log(S.blue?'blue':'yellow','','',true); renderButtons(); };
$('b-tube').onclick=()=>{ S.tubeIn=!S.tubeIn; log(S.tubeIn?'into':'out','','',true); renderButtons(); };
$('b-reset').onclick=()=>reset();
$('c-labels').onchange=e=>{ $('labels').style.display=e.target.checked?'':'none'; };
let speed=4;
document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{ speed=+b.dataset.speed; document.querySelectorAll('[data-speed]').forEach(x=>x.classList.toggle('on',x===b)); });
$('lang-mn').onclick=()=>{lang='mn';renderText();}; $('lang-en').onclick=()=>{lang='en';renderText();};

// tube moves smoothly
let last=performance.now();
function frame(now){
  const real=Math.min(0.05,(now-last)/1000); last=now;
  const target=S.tubeIn?TIP_IN:TIP_OUT; S.tip+= (target-S.tip)*Math.min(1,real*6);
  const sim=real*speed; const n=Math.ceil(sim/0.05);
  for(let i=0;i<n;i++) step(sim/n);
  draw(real); renderButtons();
  requestAnimationFrame(frame);
}
S=fresh('cuco3'); renderText(); draw(0); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
