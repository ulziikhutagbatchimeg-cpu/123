<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SN2 урвалын механизм — 3D симуляц</title>
<style>
  :root{--bg:#0d1117;--card:#161b22;--line:#2a313c;--txt:#e6edf3;--mut:#9aa7b4;--acc:#4fd1ff;--gold:#ffcf4a}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{padding:14px 16px 6px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  h1{font-size:20px;margin:0}
  .eq{margin:0;color:var(--mut);font-size:15px}
  #stage{position:relative;height:46vh;min-height:280px;background:radial-gradient(ellipse at 50% 40%,#1c2533 0%,#0d1117 75%)}
  #c{width:100%;height:100%;display:block;touch-action:none}
  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .lab{position:absolute;transform:translate(-50%,-100%);font-weight:600;font-size:14px;text-shadow:0 1px 3px #000,0 0 6px #000;white-space:nowrap}
  .tag{position:absolute;transform:translate(-50%,0);font-size:12px;line-height:1.25;text-align:center;color:#cfe8ff;background:#0b1a26cc;border:1px solid #2b4a60;border-radius:8px;padding:3px 7px;white-space:nowrap}
  .tag b{color:var(--acc)}
  .lab sup{color:var(--gold);font-size:12px;margin-left:1px}
  .hint{position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--mut)}
  .badge{position:absolute;left:10px;top:10px;font-size:12px;background:#000a;border:1px solid var(--line);padding:4px 8px;border-radius:8px;color:var(--mut)}
  #panel{padding:12px 14px 30px;max-width:820px;margin:0 auto}
  .steps{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
  .steps button{background:var(--card);color:var(--mut);border:1px solid var(--line);border-radius:10px;padding:7px 2px;font-size:11.5px;line-height:1.2;cursor:pointer}
  .steps button.on{color:#001a24;background:var(--acc);border-color:var(--acc);font-weight:600}
  .ctrl{display:flex;align-items:center;gap:10px;margin:12px 0 4px}
  #play{width:44px;height:44px;border-radius:50%;border:none;background:var(--acc);color:#001a24;font-size:18px;cursor:pointer;flex:none}
  input[type=range]{flex:1;accent-color:var(--acc)}
  .rc{font-size:11px;color:var(--mut);display:flex;justify-content:space-between;margin:0 0 8px 54px}
  #desc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0 10px}
  #desc h2{font-size:16px;margin:0 0 6px;color:var(--acc)}
  #desc p{margin:0;font-size:14.5px;line-height:1.55;color:#d3dbe3}
  #energy{width:100%;height:170px;display:block;background:var(--card);border:1px solid var(--line);border-radius:12px}
  .tog{display:flex;gap:16px;flex-wrap:wrap;margin:10px 2px;font-size:13.5px;color:var(--mut)}
  .tog input{accent-color:var(--acc)}
  details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px}
  summary{cursor:pointer;font-weight:600}
  details li,details p{font-size:14px;line-height:1.55;color:#d3dbe3}
  .key{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin:8px 2px 0}
  .dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}

  .sw{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
  .seg button{background:transparent;color:var(--mut);border:none;padding:6px 11px;font-size:12.5px;cursor:pointer}
  .seg button.on{background:var(--acc);color:#001a24;font-weight:700}
  #lvl button.on{background:#ffcf4a;color:#2a1d00}
  .lvlnote{font-size:12px;color:var(--mut);margin:6px 2px 0}
  .note{color:var(--mut);font-size:12.5px}
</style>
</head>
<body>
<header>
  <h1><span data-i18n="h1"></span></h1>
  <p class="eq">CH₃Br + OH⁻ → CH₃OH + Br⁻</p>

  <div class="sw">
    <div class="seg" id="lvl"><button data-v="as">AS</button><button data-v="al">A Level</button></div>
    <div class="seg" id="lng"><button data-v="mn">MN</button><button data-v="en">EN</button></div>
  </div>
</header>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="labels"></div>
  <div class="badge" id="badge"></div>
  <div class="hint"><span data-i18n="hint"></span></div>
</div>

<section id="panel">
  <div class="steps" id="steps">
    <button data-t="0"><span data-i18n="b1"></span></button>
    <button data-t="0.2"><span data-i18n="b2"></span></button>
    <button data-t="0.5"><span data-i18n="b3"></span></button>
    <button data-t="0.74"><span data-i18n="b4"></span></button>
    <button data-t="1"><span data-i18n="b5"></span></button>
  </div>
  <div class="ctrl">
    <button id="play" aria-label="Play">▶</button>
    <input type="range" id="t" min="0" max="1000" value="0" aria-label="Reaction progress">
  </div>
  <div class="rc"><span><span data-i18n="rcS"></span></span><span>‡</span><span><span data-i18n="rcE"></span></span></div>

  <div id="desc"><h2></h2><p></p></div>

  <canvas id="energy"></canvas>

  <div class="tog">
    <label id="orbWrap"><input type="checkbox" id="orb" checked> <span data-i18n="orb"></span></label>
    <label><input type="checkbox" id="arr" checked> <span data-i18n="arr"></span></label>
  </div>
  <div class="key">
    <span><i class="dot" style="background:#5a616b"></i>C</span>
    <span><i class="dot" style="background:#f4f4f4"></i>H</span>
    <span><i class="dot" style="background:#e23b3b"></i>O</span>
    <span><i class="dot" style="background:#9c3a22"></i>Br</span>
    <span><i class="dot" style="background:#ffcf4a"></i><span data-i18n="kPart"></span></span>
    <span id="kSigW"><i class="dot" style="background:#3fa8ff"></i><span data-i18n="kSig"></span></span>
  </div>

  <details>
    <summary data-i18n="detSum"></summary>
    <ul id="detList"></ul>
    <p class="note" data-i18n="note"></p>
  </details>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const I18N={"mn": {"title": "SN2 урвалын механизм — 3D симуляц", "h1": "S<sub>N</sub>2 урвалын механизм", "hint": "Чирж эргүүлнэ · чимхэж томруулна", "b1": "1. Анхны<br>төлөв", "b2": "2. Ойртолт", "b3": "3. Шилжилт.<br>төлөв ‡", "b4": "4. Урвуу<br>эргэлт", "b5": "5. Бүтээг-<br>дэхүүн", "rcS": "Эхлэл", "rcE": "Төгсгөл", "orb": "σ* орбиталь", "arr": "Электрон шилжилтийн сум", "kPart": "хагас холбоос", "kSig": "σ* (хоосон орбиталь)", "tagSub": "<b>Эх бодис</b> (субстрат)<br>CH₃Br", "tagNu": "<b>Урвалж</b> (нуклеофил)<br>OH⁻", "energy": "Энерги", "rc": "Урвалын координат →", "c1": "ион–диполь", "c2": "комплекс", "detSum": "Гол санаа", "note": "AS / A Level хуваалтыг Cambridge 9701 хөтөлбөрийн ерөнхий бүтцэд үндэслэв; өөрийн хөтөлбөрөөр шалгана уу. Зай (Å) бодиттой ойролцоо; энергийн диаграм чанарын (харьцангуй)."}, "en": {"title": "SN2 Reaction Mechanism — 3D Simulation", "h1": "S<sub>N</sub>2 Reaction Mechanism", "hint": "Drag to rotate · pinch to zoom", "b1": "1. Initial<br>state", "b2": "2. Approach", "b3": "3. Transition<br>state ‡", "b4": "4. Inversion", "b5": "5. Products", "rcS": "Start", "rcE": "End", "orb": "σ* orbital", "arr": "Electron-pushing arrows", "kPart": "partial bond", "kSig": "σ* (empty orbital)", "tagSub": "<b>Substrate</b><br>CH₃Br", "tagNu": "<b>Reagent</b> (nucleophile)<br>OH⁻", "energy": "Energy", "rc": "Reaction coordinate →", "c1": "ion–dipole", "c2": "complex", "detSum": "Key points", "note": "The AS / A Level split follows the general structure of the Cambridge 9701 syllabus; check it against your own syllabus. Distances (Å) are close to real values; the energy diagram is qualitative."}};
const DET={"mn": {"as": ["<b>S</b> — орлуулах, <b>N</b> — нуклеофил, <b>2</b> — хурд тодорхойлох алхамд 2 бөөмс оролцоно.", "1° галогеналкан → S<sub>N</sub>2; 3° → S<sub>N</sub>1; 2° → хоёулаа.", "Нэг алхамт: холбоос үүсэх, тасрах зэрэг явагдана, завсрын бодисгүй."], "al": ["Хурд = k[R–X][OH⁻] — 2-р эрэмбийн урвал.", "Арын довтолгоо → конфигурац урвуулна (хираль бол эсрэг энантиомер).", "Стерик саад: метил &gt; 1° &gt; 2° ≫ 3°.", "Сайн гарах бүлэг: I⁻ &gt; Br⁻ &gt; Cl⁻ (C–Hal холбоос сулрах тусам хурдан)."]}, "en": {"as": ["<b>S</b> — substitution, <b>N</b> — nucleophilic, <b>2</b> — two species in the rate-determining step.", "1° halogenoalkanes → S<sub>N</sub>2; 3° → S<sub>N</sub>1; 2° → a mixture.", "One step: bond making and breaking happen together; no intermediate."], "al": ["Rate = k[R–X][OH⁻] — second order overall.", "Backside attack → inversion of configuration (a chiral substrate gives the opposite enantiomer).", "Steric hindrance: methyl &gt; 1° &gt; 2° ≫ 3°.", "Leaving group: I⁻ &gt; Br⁻ &gt; Cl⁻ (weaker C–Hal bond reacts faster)."]}};
const cl=x=>Math.min(1,Math.max(0,x));
const ss=(a,b,x)=>{x=cl((x-a)/(b-a));return x*x*(3-2*x);};
const lerp=(a,b,u)=>a+(b-a)*u;
const ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;

const stage=$('stage'), cv=$('c');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,1,0.1,100);
camera.position.set(2.4,3.0,10.5);
scene.add(camera);
const controls=new THREE.OrbitControls(camera,cv);
controls.enableDamping=true; controls.dampingFactor=.08;
controls.minDistance=4; controls.maxDistance=24; controls.enablePan=false;

scene.add(new THREE.HemisphereLight(0xdde8ff,0x1a1a28,0.75));
const keyL=new THREE.DirectionalLight(0xffffff,1.25); keyL.position.set(3,4,3); camera.add(keyL);
const rim=new THREE.DirectionalLight(0x7fa4ff,0.55); rim.position.set(-6,-3,-6); scene.add(rim);

const mol=new THREE.Group();mol.rotation.y=Math.PI;scene.add(mol);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.3,metalness:.06});
const sph=new THREE.SphereGeometry(1,48,32);
const cyl=new THREE.CylinderGeometry(1,1,1,20,1);
const UP=new THREE.Vector3(0,1,0);
const V=(x,y,z)=>new THREE.Vector3(x,y,z);

const COL={C:0x4f5660,H:0xf4f4f4,O:0xe23b3b,Br:0x9c3a22};
function atom(r,c){const m=new THREE.Mesh(sph,mat(c));m.scale.setScalar(r);m.userData.r=r;mol.add(m);return m;}
const C=atom(.38,COL.C), O=atom(.36,COL.O), Hn=atom(.24,COL.H), Br=atom(.52,COL.Br);
const H=[0,1,2].map(()=>atom(.25,COL.H));

function placeCyl(m,a,b,r){const d=V().subVectors(b,a);const L=d.length();m.position.copy(a).addScaledVector(d,.5);m.scale.set(r,L,r);m.quaternion.setFromUnitVectors(UP,d.normalize());}
class Bond{
  constructor(ca,cb){
    this.h1=new THREE.Mesh(cyl,mat(ca));this.h2=new THREE.Mesh(cyl,mat(cb));mol.add(this.h1,this.h2);
    this.dm=new THREE.MeshStandardMaterial({color:0xffcf4a,emissive:0x5a3c00,roughness:.4,transparent:true});
    this.d=[];for(let i=0;i<7;i++){const m=new THREE.Mesh(cyl,this.dm);mol.add(m);this.d.push(m);}
  }
  set(a,b,o){
    const solid=o>.93, dash=!solid&&o>.04;
    this.h1.visible=this.h2.visible=solid; this.d.forEach(m=>m.visible=dash);
    if(solid){const m=a.clone().lerp(b,.5);placeCyl(this.h1,a,m,.09);placeCyl(this.h2,m,b,.09);}
    else if(dash){this.dm.opacity=.3+.7*o;const N=7;for(let i=0;i<N;i++){placeCyl(this.d[i],a.clone().lerp(b,(i+.2)/N),a.clone().lerp(b,(i+.72)/N),.04+.045*o);}}
  }
}
const bCO=new Bond(COL.O,COL.C), bCB=new Bond(COL.C,COL.Br), bOH=new Bond(COL.O,COL.H);
const bCH=[0,1,2].map(()=>new Bond(COL.C,COL.H));

// σ* orbital lobes
const lobeB=new THREE.Mesh(sph,new THREE.MeshPhysicalMaterial({color:0x3fa8ff,transparent:true,opacity:.33,roughness:.15,depthWrite:false}));
const lobeF=new THREE.Mesh(sph,new THREE.MeshPhysicalMaterial({color:0xff9f43,transparent:true,opacity:.3,roughness:.15,depthWrite:false}));
lobeB.scale.set(.9,.62,.62); lobeF.scale.set(.42,.34,.34); mol.add(lobeB,lobeF);

// curved electron-pushing arrows
const arrMat=new THREE.MeshStandardMaterial({color:0x4fd1ff,emissive:0x0a4a66,transparent:true});
const coneG=new THREE.ConeGeometry(.13,.32,16);
const arrows=[0,1].map(()=>{const h=new THREE.Mesh(coneG,arrMat);mol.add(h);return{tube:null,head:h};});
function setArrow(a,p0,p1,p2,vis){
  if(a.tube){mol.remove(a.tube);a.tube.geometry.dispose();a.tube=null;}
  a.head.visible=vis; if(!vis)return;
  const cv3=new THREE.QuadraticBezierCurve3(p0,p1,p2);
  a.tube=new THREE.Mesh(new THREE.TubeGeometry(cv3,40,.042,8,false),arrMat); mol.add(a.tube);
  const tan=cv3.getTangent(1); a.head.position.copy(p2).addScaledVector(tan,.12); a.head.quaternion.setFromUnitVectors(UP,tan);
}

// charge glow clouds
const glowO=new THREE.Mesh(sph,new THREE.MeshBasicMaterial({color:0xff4d4d,transparent:true,opacity:.16,depthWrite:false}));
const glowB=new THREE.Mesh(sph,new THREE.MeshBasicMaterial({color:0xff4d4d,transparent:true,opacity:0,depthWrite:false}));
glowO.scale.setScalar(.95);glowB.scale.setScalar(1.05);mol.add(glowO,glowB);
// dipole arrow of C–Br (μ), points toward δ− end
const dipMat=new THREE.MeshStandardMaterial({color:0xb48cff,emissive:0x2a1650,transparent:true});
const dip=new THREE.Group();mol.add(dip);
{const sh=new THREE.Mesh(cyl,dipMat);placeCyl(sh,V(-.15,0,0),V(1.55,0,0),.035);
 const hd=new THREE.Mesh(new THREE.ConeGeometry(.1,.26,14),dipMat);hd.position.set(1.66,0,0);hd.rotation.z=-Math.PI/2;
 const cr=new THREE.Mesh(cyl,dipMat);placeCyl(cr,V(.1,-.14,0),V(.1,.14,0),.035);
 const inner=new THREE.Group();inner.add(sh,hd,cr);inner.position.y=.95;dip.add(inner);}

// labels
const labWrap=$('labels');
function mkLab(obj,el){const d=document.createElement('div');d.className='lab';labWrap.appendChild(d);return{obj,el,d,ch:''};}
const labs=[mkLab(C,'C'),mkLab(O,'O'),mkLab(Br,'Br')];
function mkTag(obj,html){const d=document.createElement('div');d.className='tag';d.innerHTML='';labWrap.appendChild(d);return{key:html,obj,d,dy:-1.25};}
const tags=[mkTag(C,'tagSub'),mkTag(O,'tagNu')];

const STEP_H={"mn": ["1. Анхны төлөв", "2. Ойртолт ба чиглэл", "3. Шилжилтийн төлөв ‡", "4. Урвуу эргэлт", "5. Бүтээгдэхүүн"], "en": ["1. Initial state", "2. Approach and orientation", "3. Transition state ‡", "4. Inversion", "5. Products"]};
const STEP_P={"mn": {"as": ["Эх бодис CH₃Br-д C–Br холбоос туйлт: C δ⁺, Br δ⁻. Урвалж OH⁻ — нуклеофил (электрон хос өгөгч).", "OH⁻-ийн чөлөөт электрон хос δ⁺ C руу Br-ийн эсрэг талаас довтолно (сум).", "C–O холбоос үүсэж, C–Br тасарч байна — нэг алхамд нэгэн зэрэг. Сөрөг цэнэг O ба Br-д хуваагдана.", "Br⁻ гарч, гурван H эсрэг тал руу эргэнэ.", "CH₃OH ба Br⁻ үүснэ. 1° галогеналканууд ихэвчлэн S_N2 замаар урвална."], "al": ["C–Br туйлт (C δ⁺). OH⁻ — хүчтэй нуклеофил. Метил/1° субстрат стерик саад багатай тул S_N2 замаар явна.", "Арын довтолгоо (180°): O-ийн чөлөөт хос C–Br-ийн хоосон σ* орбиталь руу орно. Br-ийн тал хаалттай.", "[HO···CH₃···Br]⁻ — энергийн оргил, тусгаарлагдахгүй. Хоёр бөөмс оролцох тул хурд = k[CH₃Br][OH⁻] (2-р эрэмбэ).", "Конфигурац урвуулна (Вальдены урвуу эргэлт): хираль субстратаас эсрэг энантиомер гарна.", "CH₃OH + Br⁻. Нэг алхамт, завсрын бодисгүй; хурд хоёр бодисын концентрацаас хамаарна."]}, "en": {"as": ["In the substrate CH₃Br the C–Br bond is polar: C δ⁺, Br δ⁻. The reagent OH⁻ is a nucleophile (an electron-pair donor).", "A lone pair on OH⁻ attacks the δ⁺ carbon from the side opposite Br (curly arrow).", "The C–O bond forms as the C–Br bond breaks — at the same time, in one step. The negative charge is shared by O and Br.", "Br⁻ leaves and the three H atoms flip to the other side.", "CH₃OH and Br⁻ form. Primary halogenoalkanes usually react by S_N2."], "al": ["Polar C–Br (C δ⁺). OH⁻ is a strong nucleophile. A methyl/1° substrate has little steric hindrance, so it reacts by S_N2.", "Backside attack (180°): the O lone pair feeds into the empty C–Br σ* orbital; the Br side is blocked.", "[HO···CH₃···Br]⁻ is the energy maximum and cannot be isolated. Two species take part, so rate = k[CH₃Br][OH⁻] (second order).", "The configuration is inverted (Walden inversion): a chiral substrate gives the opposite enantiomer.", "CH₃OH + Br⁻. One step, no intermediate; the rate depends on both concentrations."]}};
const stepOf=t=>t<.1?0:t<.42?1:t<.58?2:t<.92?3:4;

let t=0,lastT=-1,playing=false,target=null,showOrb=true,showArr=true;

function update(t){
  let dO,dB;
  if(t<.2){const u=ease(t/.2);dO=lerp(7.0,3.1,u);dB=lerp(1.94,1.97,u);}
  else if(t<.5){const u=ease((t-.2)/.3);dO=lerp(3.1,2.05,u);dB=lerp(1.97,2.42,u*u);}
  else{const u=ease((t-.5)/.5);dO=lerp(2.05,1.43,Math.sqrt(u));dB=lerp(2.42,5.4,u);}
  // orientation: reactants tumble freely, then align for backside attack
  const al=ss(.0,.19,t);
  const qS=new THREE.Quaternion().setFromEuler(new THREE.Euler(1.1,.75,1.35)).slerp(new THREE.Quaternion(),al);
  const qO=new THREE.Quaternion().setFromEuler(new THREE.Euler(.4,1.6,2.3)).slerp(new THREE.Quaternion(),al);
  const c=V(0,0,0),o=V(-dO,0,0),b=V(dB,0,0).applyQuaternion(qS);
  C.position.copy(c);O.position.copy(o);Br.position.copy(b);
  mol.position.x=(dB-dO)/2;
  const a=ss(.3,.75,t),hx=-.36*(1-2*a),r=Math.sqrt(1.09*1.09-hx*hx);
  H.forEach((h,k)=>{const f=k*2*Math.PI/3+.35;h.position.set(hx,r*Math.cos(f),r*Math.sin(f)).applyQuaternion(qS);bCH[k].set(c,h.position,1);});
  const hn=o.clone().add(V(-.33,.91,0).applyQuaternion(qO));Hn.position.copy(hn);bOH.set(o,hn,1);
  const oc=ss(.22,.88,t);bCO.set(o,c,oc);bCB.set(c,b,1-oc);

  const k1=1-ss(.3,.55,t);
  lobeB.visible=lobeF.visible=showOrb&&k1>.01;
  lobeB.material.opacity=.33*k1;lobeF.material.opacity=.3*k1;
  lobeB.position.set(-.85,0,0).applyQuaternion(qS);lobeF.position.copy(b).multiplyScalar(.45);
  lobeB.quaternion.copy(qS);lobeF.quaternion.copy(qS);
  const kd=1-ss(.2,.35,t);dip.visible=kd>.01;dipMat.opacity=kd;dip.quaternion.copy(qS);
  glowO.position.copy(o);glowO.material.opacity=.17*(1-ss(.3,.62,t));
  glowB.position.copy(b);glowB.material.opacity=.17*ss(.45,.95,t);
  tags.forEach(g=>g.op=1-ss(.07,.15,t));

  const k2=ss(.1,.2,t)*(1-ss(.32,.5,t)),av=showArr&&k2>.01;arrMat.opacity=k2;
  const p0=o.clone().add(V(.28,.32,0)),p2=V(-.55,.2,0);
  setArrow(arrows[0],p0,p0.clone().lerp(p2,.5).add(V(0,1.3,0)),p2,av);
  const q0=b.clone().multiplyScalar(.5).add(V(0,.14,0)),q2=b.clone().add(V(.05,.62,0));
  setArrow(arrows[1],q0,q0.clone().lerp(q2,.5).add(V(0,.85,0)),q2,av);

  labs[0].ch=t<.62?'δ+':'';
  labs[1].ch=t<.18?'−':(t<.85?'δ−':'');
  labs[2].ch=t<.82?'δ−':'−';
  labs.forEach(l=>l.d.innerHTML='<b>'+l.el+'</b>'+(l.ch?'<sup>'+l.ch+'</sup>':''));

  const s=stepOf(t);
  $('desc').querySelector('h2').textContent=STEP_H[lang][s];
  $('desc').querySelector('p').textContent=STEP_P[lang][level][s];
  document.querySelectorAll('#steps button').forEach((bt,i)=>bt.classList.toggle('on',i===s));
  $('badge').textContent='C···O '+dO.toFixed(2)+' Å · C–Br '+dB.toFixed(2)+' Å';
  $('t').value=Math.round(t*1000);
  drawEnergy(t);
}

// energy diagram
const ec=$('energy'),ex=ec.getContext('2d');
const G=(t,m,w)=>Math.exp(-Math.pow(t-m,2)/(2*w*w));
const E=t=>G(t,.5,.1)-.42/(1+Math.exp(-(t-.5)*12))-.13*G(t,.2,.055)-.12*G(t,.82,.055);
function drawEnergy(t){
  const dpr=window.devicePixelRatio||1,w=ec.clientWidth,h=ec.clientHeight;
  if(ec.width!==w*dpr){ec.width=w*dpr;ec.height=h*dpr;}
  ex.setTransform(dpr,0,0,dpr,0,0);ex.clearRect(0,0,w,h);
  const L=34,R=w-14,TP=22,B=h-26;
  const X=u=>L+(R-L)*u, Y=e=>B-(e+.5)/1.6*(B-TP);
  ex.strokeStyle='#3a4350';ex.lineWidth=1;ex.beginPath();ex.moveTo(L,TP-6);ex.lineTo(L,B);ex.lineTo(R,B);ex.stroke();
  ex.fillStyle='#9aa7b4';ex.font='11px system-ui';
  ex.save();ex.translate(12,(TP+B)/2);ex.rotate(-Math.PI/2);ex.textAlign='center';ex.fillText(T('energy'),0,0);ex.restore();
  ex.textAlign='center';ex.fillText(T('rc'),(L+R)/2,h-8);
  // Ea bracket
  const e0=E(0),eT=E(.5);
  ex.setLineDash([3,3]);ex.strokeStyle='#5a6573';ex.beginPath();ex.moveTo(X(0),Y(e0));ex.lineTo(X(.5),Y(e0));ex.stroke();ex.setLineDash([]);
  ex.strokeStyle='#ffcf4a';ex.beginPath();ex.moveTo(X(.45),Y(e0));ex.lineTo(X(.45),Y(eT)+3);ex.stroke();
  ex.fillStyle='#ffcf4a';ex.textAlign='right';ex.fillText('Eₐ',X(.43),(Y(e0)+Y(eT))/2+4);
  // curve
  ex.strokeStyle='#4fd1ff';ex.lineWidth=2.5;ex.beginPath();
  for(let i=0;i<=200;i++){const u=i/200;i?ex.lineTo(X(u),Y(E(u))):ex.moveTo(X(u),Y(E(u)));}
  ex.stroke();
  ex.fillStyle='#e6edf3';ex.font='11.5px system-ui';ex.textAlign='left';
  ex.fillText('CH₃Br + OH⁻',X(0)+4,Y(e0)-7);
  ex.textAlign='center';ex.fillText('‡ [HO···CH₃···Br]⁻',X(.5),Y(eT)-7);
  ex.textAlign='right';ex.fillText('CH₃OH + Br⁻',R-2,Y(E(1))-7);
  ex.fillStyle='#9aa7b4';ex.font='10.5px system-ui';ex.textAlign='center';
  ex.fillText(T('c1'),X(.2),Y(E(.2))+14);ex.fillText(T('c2'),X(.2),Y(E(.2))+26);
  // marker
  ex.fillStyle='#fff';ex.beginPath();ex.arc(X(t),Y(E(t)),6,0,7);ex.fill();
  ex.strokeStyle='#4fd1ff';ex.lineWidth=2;ex.stroke();
}

function resize(){
  const w=stage.clientWidth,h=stage.clientHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;
  camera.fov=40;camera.updateProjectionMatrix();
  const need=Math.max(10.5,6.0/(Math.tan(20*Math.PI/180)*camera.aspect));
  camera.position.setLength(Math.min(22,need));
  lastT=-1;
}
window.addEventListener('resize',resize);

const tmp=new THREE.Vector3();
function placeLabels(){
  const w=stage.clientWidth,h=stage.clientHeight;
  labs.forEach(l=>{
    l.obj.getWorldPosition(tmp);tmp.y+=l.obj.userData.r+.18;tmp.project(camera);
    l.d.style.left=((tmp.x+1)/2*w)+'px';l.d.style.top=((1-tmp.y)/2*h)+'px';
    l.d.style.display=tmp.z<1?'block':'none';
  });
  tags.forEach(g=>{
    g.obj.getWorldPosition(tmp);tmp.y+=g.dy;tmp.project(camera);
    const hw=g.d.offsetWidth/2+4;g.d.style.left=Math.min(w-hw,Math.max(hw,(tmp.x+1)/2*w))+'px';g.d.style.top=((1-tmp.y)/2*h)+'px';
    g.d.style.opacity=g.op;g.d.style.display=(g.op>.01&&tmp.z<1)?'block':'none';
  });
}

// controls
const playBtn=$('play');
function setPlay(p){playing=p;playBtn.textContent=p?'❚❚':'▶';}
playBtn.onclick=()=>{target=null;if(!playing&&t>=.999)t=0;setPlay(!playing);};
$('t').addEventListener('input',e=>{setPlay(false);target=null;t=e.target.value/1000;});
document.querySelectorAll('#steps button').forEach(b=>b.onclick=()=>{setPlay(false);target=parseFloat(b.dataset.t);});
$('orb').onchange=e=>{showOrb=level==='al'&&e.target.checked;lastT=-1;};
$('arr').onchange=e=>{showArr=e.target.checked;lastT=-1;};

let prev=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-prev)/1000);prev=now;
  if(playing){
    const slow=.4+.6*Math.min(1,Math.abs(t-.5)/.12);
    t+=dt*.11*slow; if(t>=1){t=1;setPlay(false);}
  }else if(target!==null){
    const d=target-t; if(Math.abs(d)<.002){t=target;target=null;} else t+=Math.sign(d)*Math.min(Math.abs(d),dt*.45);
  }
  if(t!==lastT){update(t);lastT=t;}
  controls.update();renderer.render(scene,camera);placeLabels();
  requestAnimationFrame(loop);
}

/* ---------- language + level engine ---------- */
let lang='mn',level='as';
try{const hs=location.hash.slice(1).split('-');hs.forEach(x=>{if(x==='en'||x==='mn')lang=x;if(x==='as'||x==='al')level=x;});
  if(!location.hash){const a=localStorage.getItem('simLang'),b=localStorage.getItem('simLevel');if(a)lang=a;if(b)level=b;}}catch(e){}
const T=k=>{const v=I18N[lang][k];return v===undefined?k:v;};
function applySettings(){
  document.documentElement.lang=lang;document.title=T('title');
  document.querySelectorAll('[data-i18n]').forEach(e=>e.innerHTML=T(e.dataset.i18n));
  tags.forEach(g=>g.d.innerHTML=T(g.key));
  document.getElementById('detList').innerHTML=DET[lang][level].map(x=>'<li>'+x+'</li>').join('');
  document.querySelectorAll('#lng button').forEach(b=>b.classList.toggle('on',b.dataset.v===lang));
  document.querySelectorAll('#lvl button').forEach(b=>b.classList.toggle('on',b.dataset.v===level));
  const ow=document.getElementById('orbWrap');document.getElementById('kSigW').style.display=level==='al'?'':'none';ow.style.display=level==='al'?'':'none';
  showOrb=level==='al'&&document.getElementById('orb').checked;
  if(typeof onLevel==='function')onLevel();
  try{localStorage.setItem('simLang',lang);localStorage.setItem('simLevel',level);}catch(e){}
  lastT=-1;
}
document.querySelectorAll('#lng button').forEach(b=>b.onclick=()=>{lang=b.dataset.v;applySettings();});
document.querySelectorAll('#lvl button').forEach(b=>b.onclick=()=>{level=b.dataset.v;applySettings();});
applySettings();resize();update(0);requestAnimationFrame(loop);
})();
</script>
