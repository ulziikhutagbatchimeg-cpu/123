<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Атомын бүтэц – 9701 виртуал лаборатори</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Noto+Sans:wght@400;500;600;700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{
  /* The teacher's IGCSE atomic-structure lab, raised to Cambridge 9701: AS chapter 1 (and 2.1) and A Level chapter 28 */
  --bg:#f6f5fb; --card:#ffffff; --ink:#1f1d2b; --muted:#6b6880; --line:#e4e1ef;
  --accent:#6d28d9; --accent-soft:#f1ebff; --proton:#e0464b; --neutron:#8d93a3; --electron:#2f6fe0; --ok:#15803d; --warn:#b45309;
  --display:"Manrope",system-ui,sans-serif; --body:"Noto Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#14121c; --card:#1d1a28; --ink:#ece9f6; --muted:#a29fb6; --line:#332f45;
    --accent:#a78bfa; --accent-soft:#2a2340; --proton:#ff6b6f; --neutron:#a9afbf; --electron:#5b9bff; --ok:#4ade80; --warn:#fbbf24; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#14121c; --card:#1d1a28; --ink:#ece9f6; --muted:#a29fb6; --line:#332f45;
  --accent:#a78bfa; --accent-soft:#2a2340; --proton:#ff6b6f; --neutron:#a9afbf; --electron:#5b9bff; --ok:#4ade80; --warn:#fbbf24; color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 28px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;margin-bottom:12px}
h1{font-family:var(--display);font-size:22px;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.hright{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lang,.lvl{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{font:600 14px var(--body);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer}
.tab[hidden]{display:none}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tab:focus-visible,.btn:focus-visible,input:focus-visible,.el:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--accent-soft);color:var(--accent);margin-left:4px}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.card h2{font-family:var(--display);font-size:15px;margin:0 0 8px}
canvas{display:block;width:100%;border-radius:12px;background:var(--bg)}
.btn{font:600 14px var(--body);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:10px;cursor:pointer}
.btn.sm{padding:5px 10px;font-size:13px;border:0;border-radius:0}
.btn.xs{padding:4px 9px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.counters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.ctr{border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:center}
.ctr .nm{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.ctr .row{display:flex;align-items:center;gap:8px}
.ctr .num{font:800 22px var(--display);min-width:32px;text-align:center;font-variant-numeric:tabular-nums}
.pm{width:36px;height:36px;padding:0;font-size:20px;line-height:1}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%}
.idbox{display:flex;gap:14px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.nuc{display:inline-flex;align-items:center;font-family:var(--display);color:var(--ink)}
.nuc .az{display:inline-flex;flex-direction:column;align-items:flex-end;font-size:20px;line-height:1.05;margin-right:2px;font-weight:700}
.nuc .sym{font-size:56px;font-weight:800;line-height:1}
.nuc .chg{align-self:flex-start;font-size:22px;font-weight:800;margin-left:2px;color:var(--accent)}
.idtext .name{font:800 20px var(--display)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;font-size:13px;background:var(--accent-soft);color:var(--accent);margin:2px 4px 2px 0}
.pill.ok{background:color-mix(in srgb, var(--ok) 15%, transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb, var(--warn) 18%, transparent);color:var(--warn)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
td.n{font-variant-numeric:tabular-nums}
.note{margin-top:10px;font-size:13px;background:var(--accent-soft);border-radius:10px;padding:8px 10px}
.def{margin-top:10px;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.def b{color:var(--accent)}
.task{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.task ol{margin:4px 0 0;padding-left:20px}
.task li{margin-bottom:3px}
.chal{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:6px}
.chal li{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:14px}
.chal li .box{width:18px;height:18px;border-radius:5px;border:2px solid var(--line);flex:none;margin-top:2px;display:grid;place-items:center;font-size:12px;color:#fff}
.chal li.done{border-color:var(--ok)}
.chal li.done .box{background:var(--ok);border-color:var(--ok)}
/* The Periodic Table, Z = 1–36, in 18 groups; s, p and d blocks tinted */
.pt{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:2px}
.el{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:3px 0;text-align:center;cursor:pointer;font:inherit;color:var(--ink);min-width:0}
.el .z{font-size:8px;color:var(--muted);display:block;line-height:1.1}
.el .s{font:800 12px var(--display);display:block;line-height:1.2}
.el.bs{background:color-mix(in srgb, var(--electron) 10%, var(--card))}
.el.bp{background:color-mix(in srgb, var(--warn) 12%, var(--card))}
.el.bd{background:color-mix(in srgb, var(--accent) 12%, var(--card))}
.el[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.el[aria-pressed="true"] .z{color:#fff}
.gh{font-size:9px;color:var(--muted);text-align:center}
.blank{visibility:hidden}
.iso-ctrl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.ctl .lbl{font-size:13px;color:var(--muted);margin-right:2px}
.bar{height:26px;border-radius:8px;overflow:hidden;display:flex;margin:6px 0 10px;border:1px solid var(--line)}
.bar span{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden}
.calc{font-family:var(--display);font-size:16px;background:var(--bg);border-radius:10px;padding:10px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
label{font-size:13px;color:var(--muted)}
input[type=range]{accent-color:var(--accent);width:100%}
.panel[hidden]{display:none}
/* Box notation: one box per orbital, ↑↓ for the two spins */
.obs{display:flex;flex-wrap:wrap;gap:10px 14px;margin:8px 0}
.obg{display:flex;flex-direction:column;align-items:center;gap:2px}
.obl{font-size:12px;color:var(--muted);font-weight:600}
.obr{display:flex}
.ob{width:26px;height:30px;border:1.5px solid var(--ink);margin-left:-1.5px;display:flex;align-items:center;justify-content:center;font:700 15px var(--body);letter-spacing:-2px}
.obr .ob:first-child{margin-left:0}
.swatch{display:inline-block;width:20px;height:20px;border-radius:6px;border:1px solid var(--line);vertical-align:middle;margin-right:6px}
.vals{font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.6}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 data-i="h1">Атомын бүтэц</h1>
    <div class="hright"><span class="sub" id="subline"></span>
      <div class="lvl" role="group" aria-label="Level"><button class="btn sm" id="lv-as" aria-pressed="true">AS</button><button class="btn sm" id="lv-al" aria-pressed="false">A Level</button></div>
      <div class="lang" role="group" aria-label="Language"><button class="btn sm" id="lang-mn" aria-pressed="true">MN</button><button class="btn sm" id="lang-en" aria-pressed="false">EN</button></div></div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t1" aria-selected="true" aria-controls="p1" data-i="tab1"></button>
    <button class="tab" role="tab" id="t2" aria-selected="false" aria-controls="p2" data-i="tab2"></button>
    <button class="tab" role="tab" id="t3" aria-selected="false" aria-controls="p3" data-i="tab3"></button>
    <button class="tab" role="tab" id="t4" aria-selected="false" aria-controls="p4" data-i="tab4"></button>
    <button class="tab" role="tab" id="t5" aria-selected="false" aria-controls="p5" data-i="tab5" hidden></button>
  </div>

  <!-- ============================================ 1. THE ATOM AND ITS PARTICLES (AS 1.1, 1.2) -->
  <section class="panel" id="p1" role="tabpanel" aria-labelledby="t1">
    <div class="grid">
      <div class="card">
        <h2 data-i="atomH"></h2>
        <canvas id="cv1" height="360" aria-label="Atom model"></canvas>
        <div class="counters">
          <div class="ctr"><span class="nm"><span class="dot" style="background:var(--proton)"></span><span data-i="proton"></span></span>
            <div class="row"><button class="btn pm" id="p-" aria-label="−">−</button><span class="num" id="pn">6</span><button class="btn pm" id="p+" aria-label="+">+</button></div></div>
          <div class="ctr"><span class="nm"><span class="dot" style="background:var(--neutron)"></span><span data-i="neutron"></span></span>
            <div class="row"><button class="btn pm" id="n-" aria-label="−">−</button><span class="num" id="nn">6</span><button class="btn pm" id="n+" aria-label="+">+</button></div></div>
          <div class="ctr"><span class="nm"><span class="dot" style="background:var(--electron)"></span><span data-i="electron"></span></span>
            <div class="row"><button class="btn pm" id="e-" aria-label="−">−</button><span class="num" id="en">6</span><button class="btn pm" id="e+" aria-label="+">+</button></div></div>
        </div>
      </div>
      <div class="card">
        <div class="idbox">
          <span class="nuc" aria-label="nuclide notation"><span class="az"><span id="bA">12</span><span id="bZ">6</span></span><span class="sym" id="bS">C</span><span class="chg" id="bC"></span></span>
          <div class="idtext"><div class="name" id="bName"></div><div id="bPills"></div></div>
        </div>
        <table>
          <thead><tr><th data-i="thQ"></th><th data-i="thV"></th><th data-i="thH"></th></tr></thead>
          <tbody id="bTable"></tbody>
        </table>
        <div class="obs" id="bBoxes"></div>
        <div class="note" id="bNote"></div>
        <div class="task">
          <strong data-i="chalH"></strong>
          <ul class="chal" id="chal"></ul>
        </div>
        <div class="task">
          <strong data-i="subH"></strong>
          <table><thead><tr><th data-i="thP"></th><th data-i="thM"></th><th data-i="thC"></th><th data-i="thL"></th></tr></thead>
            <tbody id="subT"></tbody></table>
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:14px">
      <h2 data-i="beamH"></h2>
      <div class="ctl">
        <button class="btn xs" id="bm-field" aria-pressed="true" data-i="field"></button>
        <button class="btn xs" id="bm-p" aria-pressed="true" data-i="proton"></button>
        <button class="btn xs" id="bm-n" aria-pressed="true" data-i="neutron"></button>
        <button class="btn xs" id="bm-e" aria-pressed="true" data-i="electron"></button>
      </div>
      <canvas id="cvB" height="240" aria-label="Particle beams in an electric field"></canvas>
      <div class="note" data-i="beamNote"></div>
      <div class="task"><strong data-i="obs"></strong><ol data-i="tasks1"></ol></div>
    </div>
  </section>

  <!-- ============================================ 2. ISOTOPES AND THE MASS SPECTRUM (AS 1.2, 2.1) -->
  <section class="panel" id="p2" role="tabpanel" aria-labelledby="t2" hidden>
    <div class="grid">
      <div class="card">
        <h2 data-i="isoH"></h2>
        <div class="iso-ctrl" id="isoBtns"></div>
        <canvas id="cv2" height="260" aria-label="Mass spectrum"></canvas>
        <div class="bar" id="isoBar"></div>
        <div id="isoSliders"></div>
      </div>
      <div class="card">
        <h2 data-i="arH"></h2>
        <table><thead><tr><th data-i="thIso"></th><th>p</th><th>n</th><th>e</th><th data-i="thRim"></th><th data-i="thAb"></th></tr></thead><tbody id="isoT"></tbody></table>
        <div class="calc" id="isoCalc" style="margin-top:10px"></div>
        <div class="def" data-i="isoDef"></div>
        <div class="note" data-i="isoNote"></div>
        <div class="task"><strong data-i="obs"></strong><ol data-i="tasks2"></ol></div>
      </div>
    </div>
  </section>

  <!-- ============================================ 3. ORBITALS AND ELECTRONIC CONFIGURATION (AS 1.3) -->
  <section class="panel" id="p3" role="tabpanel" aria-labelledby="t3" hidden>
    <div class="grid">
      <div class="card">
        <h2 data-i="ptH"></h2>
        <div class="pt" id="pt"></div>
        <div class="ctl"><span class="lbl" data-i="chargeL"></span><span id="qBtns" style="display:flex;gap:4px;flex-wrap:wrap"></span></div>
        <canvas id="cv3" height="260" aria-label="Electron shells"></canvas>
      </div>
      <div class="card">
        <div class="idbox">
          <span class="nuc"><span class="az"><span id="tA"></span><span id="tZ"></span></span><span class="sym" id="tS"></span><span class="chg" id="tC"></span></span>
          <div class="idtext"><div class="name" id="tName"></div><div id="tPills"></div></div>
        </div>
        <table><tbody id="tTable"></tbody></table>
        <div style="margin-top:10px"><strong style="font-size:13px" data-i="boxH"></strong><div class="obs" id="tBoxes"></div></div>
        <div class="note" id="tNote"></div>
        <div class="def" data-i="rules"></div>
        <div class="task"><strong data-i="obs"></strong><ol data-i="tasks3"></ol></div>
      </div>
    </div>
  </section>

  <!-- ============================================ 4. IONISATION ENERGY (AS 1.4) -->
  <section class="panel" id="p4" role="tabpanel" aria-labelledby="t4" hidden>
    <div class="grid">
      <div class="card">
        <h2 data-i="ie1H"></h2>
        <div class="ctl"><button class="btn xs" id="ie-prev" aria-label="previous">◀</button><span id="ieSel" style="font-weight:700;min-width:150px;text-align:center"></span><button class="btn xs" id="ie-next" aria-label="next">▶</button></div>
        <canvas id="cv4a" height="280" aria-label="First ionisation energies"></canvas>
        <div class="calc" id="ieEq" style="margin-top:8px;font-size:15px"></div>
        <div class="note" id="ie1Note"></div>
        <div class="def" data-i="ieDef"></div>
      </div>
      <div class="card">
        <h2 data-i="ie2H"></h2>
        <div class="iso-ctrl" id="sucBtns"></div>
        <canvas id="cv4b" height="260" aria-label="Successive ionisation energies"></canvas>
        <div class="legend" id="sucLegend"></div>
        <div class="vals" id="sucVals"></div>
        <div class="note" id="ie2Note"></div>
        <div class="def" data-i="factors"></div>
        <div class="task"><strong data-i="obs"></strong><ol data-i="tasks4"></ol></div>
      </div>
    </div>
  </section>

  <!-- ============================================ 5. A LEVEL: TRANSITION ELEMENTS, 3d AND 4s (A Level 28.1, 28.3) -->
  <section class="panel" id="p5" role="tabpanel" aria-labelledby="t5" hidden>
    <div class="grid">
      <div class="card">
        <h2 data-i="tmH"></h2>
        <div class="iso-ctrl" id="tmEl"></div>
        <div class="ctl"><span class="lbl" data-i="oxL"></span><span id="tmOx" style="display:flex;gap:4px;flex-wrap:wrap"></span></div>
        <div class="ctl"><span class="lbl" data-i="geoL"></span><button class="btn xs" id="geo-oct" aria-pressed="true" data-i="oct"></button><button class="btn xs" id="geo-tet" aria-pressed="false" data-i="tet"></button></div>
        <canvas id="cv5" height="280" aria-label="Splitting of the d orbitals"></canvas>
      </div>
      <div class="card">
        <div class="idbox">
          <span class="nuc"><span class="sym" id="uS"></span><span class="chg" id="uC"></span></span>
          <div class="idtext"><div class="name" id="uName"></div><div id="uPills"></div></div>
        </div>
        <table><tbody id="tmTable"></tbody></table>
        <div id="tmBoxes"></div>
        <div class="note" id="tmNote"></div>
        <div class="def" data-i="tmDef"></div>
        <div class="task"><strong data-i="obs"></strong><ol data-i="tasks5"></ol></div>
      </div>
    </div>
  </section>
</div>

const sup = n => String(n).replace(/[0-9+−-]/g, ch => SUPD[ch]);

const FILL = ['1s','2s','2p','3s','3p','4s','3d','4p'];
const SHOW = ['1s','2s','2p','3s','3p','3d','4s','4p'];
const REMOVE = ['4p','4s','3d','3p','3s','2p','2s','1s'];
const capOf = s => ({s:2, p:6, d:10})[s[1]];
function atomCfg(z){ const c = {}; let r = z;
  for (const s of FILL){ if (r <= 0) break; const t = Math.min(capOf(s), r); c[s] = t; r -= t; }
  if (z === 24){ c['3d'] = 5; c['4s'] = 1; }
  if (z === 29){ c['3d'] = 10; c['4s'] = 1; }
  return c; }
function speciesCfg(z, q){ const c = atomCfg(z);
  if (q > 0){ let r = q; for (const s of REMOVE){ while (r > 0 && (c[s] || 0) > 0){ c[s]--; r--; } } }
  else if (q < 0){ let r = -q; for (const s of FILL){ while (r > 0 && (c[s] || 0) < capOf(s)){ c[s] = (c[s] || 0) + 1; r--; } } }
  return c; }
const total = c => Object.values(c).reduce((a, b) => a + b, 0);
const fmtCfg = c => SHOW.filter(s => (c[s] || 0) > 0).map(s => s + sup(c[s])).join(' ') || '—';
const CORES = [['Kr',['1s','2s','2p','3s','3p','3d','4s','4p']],['Ar',['1s','2s','2p','3s','3p']],['Ne',['1s','2s','2p']],['He',['1s']]];
function shortCfg(c, isIon){ const e = total(c);
  for (const [sym, subs] of CORES){
    const coreE = subs.reduce((a, s) => a + capOf(s), 0);
    if (!subs.every(s => (c[s] || 0) === capOf(s))) continue;
    if (e > coreE){ const rest = SHOW.filter(s => !subs.includes(s) && (c[s] || 0) > 0).map(s => s + sup(c[s])).join(' '); return `[${sym}] ${rest}`; }
    if (e === coreE && isIon) return `[${sym}]`;
  }
  return fmtCfg(c); }
function shellsOf(c){ const out = [0,0,0,0]; for (const s in c) out[+s[0] - 1] += c[s]; while (out.length && out[out.length-1] === 0) out.pop(); return out; }
function unpairedOf(c){ let u = 0; for (const s in c){ const k = capOf(s) / 2, n = c[s]; u += n <= k ? n : 2 * k - n; } return u; }
function isNobleCfg(c){ const set = {2:['1s'], 10:['1s','2s','2p'], 18:['1s','2s','2p','3s','3p'], 36:SHOW}[total(c)];
  return !!set && set.every(s => (c[s] || 0) === capOf(s)); }
function boxesHTML(c, subs){ return subs.map(s => { const k = capOf(s) / 2, n = c[s] || 0; let cells = '';
  for (let i = 0; i < k; i++){ cells += `<span class="ob">${n > i ? '↑' : ''}${n > k + i ? '↓' : ''}</span>`; }
  return `<span class="obg"><span class="obl">${s}</span><span class="obr">${cells}</span></span>`; }).join(''); }
function posOf(z){ if (z === 1) return [1,1]; if (z === 2) return [1,18]; if (z <= 10) return [2, z <= 4 ? z - 2 : z + 8];
  if (z <= 18) return [3, z <= 12 ? z - 10 : z]; return [4, z - 18]; }
const blockOf = z => { const g = posOf(z)[1]; return z === 2 || g <= 2 ? 's' : g <= 12 ? 'd' : 'p'; };
function nucleus(c, cx, cy, p, n, r0){
  const tot = p + n; if (!tot) return 0; const rr = r0; const pts = [];
  for (let i = 0; i < tot; i++){ const a = i * 2.39996, d = rr * 1.05 * Math.sqrt(i + 0.5); pts.push([cx + Math.cos(a)*d, cy + Math.sin(a)*d]); }
  const kinds = []; let pi = 0, ni = 0;
  for (let i = 0; i < tot; i++){ if ((pi / Math.max(p,1)) <= (ni / Math.max(n,1)) && pi < p || ni >= n){ kinds.push('p'); pi++; } else { kinds.push('n'); ni++; } }
  for (let i = tot - 1; i >= 0; i--){ const [x,y] = pts[i]; c.beginPath(); c.arc(x, y, rr, 0, 6.283);
    c.fillStyle = kinds[i]==='p' ? css('--proton') : css('--neutron'); c.fill(); c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1; c.stroke(); }

function drawShells(c, cx, cy, counts, rIn, gap, t, labels){
  const nSh = Math.max(counts.length, 1);
  for (let s = 0; s < nSh; s++){ const R = rIn + gap * s; c.beginPath(); c.arc(cx, cy, R, 0, 6.283); c.strokeStyle = css('--line'); c.lineWidth = 2; c.stroke(); }
  counts.forEach((k, s) => { const R = rIn + gap * s, rot = reduce ? 0 : t * (0.25 / (s + 1));
    for (let i = 0; i < k; i++){ const a = rot - Math.PI/2 + i * 6.283 / k; const x = cx + Math.cos(a)*R, y = cy + Math.sin(a)*R;
      c.beginPath(); c.arc(x, y, 5.5, 0, 6.283); c.fillStyle = css('--electron'); c.fill();
      c.fillStyle = '#fff'; c.font = '700 9px "Noto Sans", sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('−', x, y + 0.5); }
    if (labels && k){ c.fillStyle = css('--muted'); c.font = '600 12px "Noto Sans", sans-serif'; c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.fillText(String(k), cx + R + 8, cy - 4); } });
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
}

const B = {p:6, n:6, e:6}; let g1, gB;

  document.getElementById(k+'-').onclick = () => { B[k] = Math.max(lim[k][0], B[k]-1); ui1(); };

const cfg1 = () => B.p ? speciesCfg(B.p, B.p - B.e) : atomCfg(B.e);

                [L('E'), e, L('hE')], [L('charge'), q ? chargeStr(q) : '0', `${p} − ${e}`],
                [L('shellConf'), shellsOf(cf).join(', ') || '—', '2, 8, 8, 2'], [L('subConf'), fmtCfg(cf), L('hS')], [L('unp'), u, L('hU')]];
  document.getElementById('bTable').innerHTML = rows.map(r => `<tr><td>${r[0]}</td><td class="n"><b>${r[1]}</b></td><td class="sub">${r[2]}</td></tr>`).join('');

  document.getElementById('chal').innerHTML = L('ch').map(([t, f]) => { const ok = f(p, n, e, u); return `<li class="${ok?'done':''}"><span class="box">${ok?'✓':''}</span><span>${t}</span></li>`; }).join('');
  document.getElementById('subT').innerHTML = L('sub').map(r => `<tr><td>${r[0]}</td><td class="n">${r[1]}</td><td class="n">${r[2]}</td><td>${r[3]}</td></tr>`).join('');
}
function draw1(t){

const beam = {field:true, p:true, n:true, e:true};
for (const k of ['field','p','n','e']) document.getElementById('bm-' + k).onclick = ev => { beam[k] = !beam[k]; ev.currentTarget.setAttribute('aria-pressed', beam[k]); };
function drawBeam(t){
  const {c, w, h} = gB; if (w < 2) return; c.clearRect(0,0,w,h);
  const y0 = h/2, xa = w*0.32, xb = w*0.68, gp = h*0.38;
  // the plates: + above, − below
  c.fillStyle = beam.field ? css('--proton') : css('--line'); c.fillRect(xa, y0 - gp - 8, xb - xa, 8);
  c.fillStyle = beam.field ? css('--electron') : css('--line'); c.fillRect(xa, y0 + gp, xb - xa, 8);
  if (beam.field){ c.fillStyle = css('--ink'); c.font = '800 15px "Manrope", sans-serif'; c.textAlign = 'center';
    c.fillText('+  +  +  +', (xa + xb)/2, y0 - gp - 13); c.fillText('−  −  −  −', (xa + xb)/2, y0 + gp + 24); }
  // the source
  c.fillStyle = css('--muted'); c.fillRect(4, y0 - 10, 16, 20); c.font = '11px "Noto Sans", sans-serif'; c.textAlign = 'left'; c.fillText(L('src'), 4, y0 + 24);
  const D = {p: beam.field ? h*0.10 : 0, n: 0, e: beam.field ? -h*0.30 : 0};
  const path = d => x => x < xa ? y0 : x <= xb ? y0 + d * ((x - xa)/(xb - xa))**2 : y0 + d + (2*d/(xb - xa)) * (x - xb);
  const COL = {p: css('--proton'), n: css('--neutron'), e: css('--electron')};
  for (const k of ['p','n','e']){ if (!beam[k]) continue; const f = path(D[k]);
    c.strokeStyle = COL[k]; c.globalAlpha = .45; c.lineWidth = 2; c.beginPath(); let started = false;
    for (let x = 20; x <= w - 6; x += 3){ const y = f(x); if (y < 4 || y > h - 4) break; started ? c.lineTo(x, y) : c.moveTo(x, y); started = true; }
    c.stroke(); c.globalAlpha = 1;
    for (let i = 0; i < 7; i++){ const x = 20 + (((reduce ? 0 : t*90) + i*(w - 26)/7) % (w - 26)); const y = f(x); if (y < 4 || y > h - 4) continue;

  }

  c.fillStyle = css('--accent'); c.font = '700 13px "Noto Sans", sans-serif'; c.textAlign = 'left'; c.fillText('ΔE', xa + 6, (yUp + yLo)/2 + 4);
  c.fillStyle = css('--muted'); c.font = '11px "Noto Sans", sans-serif'; c.fillText(`${L(oct ? 'octS' : 'tetS')} · ${L('hs')}`, x2, Math.max(yLo, yUp) + 20);
  if (d >= 1 && d <= 9){ // the light absorbed: a wavy arrow down to the upper level
    const xw = x2 - 26, y0 = 14, y1 = yUp - 10; c.strokeStyle = css('--warn'); c.lineWidth = 1.8; c.beginPath();
    for (let y = y0; y <= y1; y += 2){ const x = xw + Math.sin((y - y0)/4)*4; y === y0 ? c.moveTo(x, y) : c.lineTo(x, y); } c.stroke();
    c.beginPath(); c.moveTo(xw - 4, y1 - 6); c.lineTo(xw, y1); c.lineTo(xw + 4, y1 - 6); c.stroke();
    c.fillStyle = css('--warn'); c.font = '600 11px "Noto Sans", sans-serif'; c.textAlign = 'right'; c.fillText(L('light'), xw - 8, y0 + 10); }
  c.textAlign = 'left';
}

/* =============================================== language, resizing and the loop */
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(el => { const v = TXT[lang][el.dataset.i]; if (typeof v === 'string') el.innerHTML = v; });
  document.title = lang === 'en' ? 'Atomic structure – 9701 virtual lab' : 'Атомын бүтэц – 9701 виртуал лаборатори';
  document.getElementById('lang-mn').setAttribute('aria-pressed', lang === 'mn'); document.getElementById('lang-en').setAttribute('aria-pressed', lang === 'en');
  applyLevel(); ui1(); buildIso(); buildPT(); ui3(); ui4(); buildTM(); uiTM();
  try { localStorage.setItem('at9701-lang', lang); } catch (e) {}
}
for (const l of ['mn','en']) document.getElementById('lang-' + l).onclick = () => { lang = l; try { history.replaceState(null, '', `#${lang}-${level}`); } catch (e) {} applyLang(); };
window.addEventListener('hashchange', () => { readHash(); applyLang(); showTab(startTab); });
function resize(){ g1 = fit(document.getElementById('cv1')); gB = fit(document.getElementById('cvB')); g2 = fit(document.getElementById('cv2'));
  g3 = fit(document.getElementById('cv3')); g4a = fit(document.getElementById('cv4a')); g4b = fit(document.getElementById('cv4b')); g5 = fit(document.getElementById('cv5')); }
window.addEventListener('resize', resize);
setIso('Cl'); applyLang(); showTab(startTab);
let t0 = performance.now();
function loop(now){ const t = (now - t0) / 1000;
  if (active === 1){ draw1(t); drawBeam(t); } else if (active === 2) draw2(); else if (active === 3) draw3(t); else if (active === 4){ draw4a(); draw4b(); } else draw5();
  requestAnimationFrame(loop); }
requestAnimationFrame(loop);
})();
