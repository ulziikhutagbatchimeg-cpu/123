<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Химийн урвалын лаборатори · Chemical Reactions Lab</title>
<style>
:root{--ink:#16233B;--soft:#4A5872;--bg:#F5F8FA;--card:#FFFFFF;--line:#DCE4EA;--teal:#1F5F7A;--acc:#C2501D;--ok:#23744A;--bad:#B03A2E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Times New Roman',Times,serif;font-size:19px;line-height:1.5}
header{padding:20px 22px 6px;max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
h1{font-size:30px;margin:0 0 2px;color:var(--teal)}
header p{margin:0;color:var(--soft)}
.lang{display:flex;gap:6px}
.lang button,nav button{font:inherit;font-weight:700;border:2px solid var(--teal);background:#fff;color:var(--teal);padding:6px 14px;border-radius:999px;cursor:pointer}
.lang button.on,nav button.on{background:var(--teal);color:#fff}
nav{max-width:1100px;margin:12px auto 0;padding:0 22px;display:flex;gap:8px;flex-wrap:wrap}
main{max-width:1100px;margin:0 auto;padding:14px 22px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px}
h2{font-size:23px;margin:0 0 10px;color:var(--teal)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font:inherit;border:1px solid var(--line);background:var(--bg);padding:6px 13px;border-radius:999px;cursor:pointer;color:var(--ink)}
.pill.on{border-color:var(--acc);background:#FCE9DF;font-weight:700}
.btn{font:inherit;font-weight:700;border:none;background:var(--teal);color:#fff;padding:8px 17px;border-radius:9px;cursor:pointer}
.btn.alt{background:var(--acc)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.eq{font-size:26px;text-align:center;margin:14px 0 6px}
.st{color:var(--soft)}
.arw{position:relative;display:inline-block;margin:0 8px}
.arw small{position:absolute;left:50%;top:-0.8em;transform:translateX(-50%);font-size:.55em;line-height:1;color:var(--acc);font-weight:700}
svg{width:100%;height:auto;display:block}
table{border-collapse:collapse;width:100%}
td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:center}
th{background:#E6EFF4}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
.coef{display:inline-flex;align-items:center;gap:4px;margin:0 6px;vertical-align:middle}
.coef button{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;line-height:1;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-family:Arial,sans-serif;font-size:20px;font-weight:700;color:var(--ink);cursor:pointer}
.coef b{min-width:24px;text-align:center;color:var(--acc);font-size:28px}
.term{display:inline-flex;align-items:center;font-size:26px;margin:8px 0}
.fx{white-space:nowrap}
.msg{min-height:28px;font-weight:700;margin-top:8px}
.steps{background:var(--bg);border-radius:10px;padding:10px 16px;margin-top:10px;display:none}
.steps.show{display:block}
.steps li{line-height:1.9}
.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.choices button{font:inherit;font-weight:700;padding:10px 6px;border-radius:12px;border:2px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink)}
.choices button small{display:block;font-weight:400;font-size:14px;color:var(--soft)}
.choices button.right{border-color:var(--ok);background:#E4F3EA}
.choices button.wrong{border-color:var(--bad);background:#F8E3E0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:16px;color:var(--soft);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block}
.schema{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.sc{background:var(--bg);border-radius:12px;padding:12px 16px}
.sc .t{font-weight:700}.sc .t small{font-weight:400;color:var(--soft);margin-left:6px}
.sc .f{font-size:20px;margin:4px 0 8px}
.dg{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ml{display:flex}
.bl{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-family:Arial,sans-serif}
.op{font-size:22px;color:var(--soft)}
.hint{color:var(--soft);font-size:16px}
.syl{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}.syl span{font-size:14px;font-weight:700;border-radius:999px;padding:2px 10px;background:#E6EFF4;color:#1F5F7A}.syl span.a{background:#FCE9DF;color:#8A3410}
.hidden{display:none}
@media (max-width:760px){.choices{grid-template-columns:repeat(2,1fr)}.eq,.term{font-size:21px}}
</style>
</head>
<body>
<header>
<div><h1 data-t="title"></h1><p data-t="sub"></p></div>
<div class="lang"><button data-l="mn">Монгол</button><button data-l="en">English</button></div>
</header>
<nav role="tablist">
<button role="tab" aria-selected="true" data-tab="sim" class="on" data-t="tab1"></button>
<button role="tab" aria-selected="false" data-tab="bal" data-t="tab2"></button>
<button role="tab" aria-selected="false" data-tab="cls" data-t="tab3"></button>
</nav>
<main>
<section id="tab-sim">
<div class="card">
<h2 data-t="simH"></h2>
<div class="syl" data-syl="sim"></div>
<div class="row" id="simPick"></div>
<div class="eq" id="simEq"></div>
<p id="simNote" style="text-align:center;margin:0 0 4px;font-weight:700"></p>
<svg id="simSvg" viewBox="0 0 800 300" aria-label="model"></svg>
<div class="row" style="justify-content:center;margin-top:8px">
<button class="btn" id="simPlay" data-t="play"></button>
<button class="btn ghost" id="simReset" data-t="reset"></button>
</div>
<div class="legend" id="simLegend"></div>
<p class="hint" data-t="stateKey"></p>
</div>
<div class="card">
<h2 data-t="countH"></h2>
<div class="syl" data-syl="cnt"></div>
<table id="simTable"></table>
<p class="hint" data-t="massLaw"></p>
</div>
</section>

<section id="tab-bal" class="hidden">
<div class="card">
<h2 data-t="balH"></h2>
<div class="syl" data-syl="bal"></div>
<p class="hint" data-t="stateKey"></p>
<div class="row" id="balPick"></div>
<div id="balEq" style="text-align:center;margin:18px 0 10px"></div>
<table id="balTable"></table>
<div class="row" style="margin-top:12px">
<button class="btn" id="balCheck" data-t="check"></button>
<button class="btn alt" id="balHint" data-t="solution"></button>
<button class="btn ghost" id="balReset" data-t="restart"></button>
</div>
<div class="msg" id="balMsg"></div>
<div class="steps" id="balSteps"></div>
</div>
</section>

<section id="tab-cls" class="hidden">
<div class="card">
<h2 data-t="clsH"></h2>
<div class="syl" data-syl="cls"></div>
<p class="hint"><span data-t="question"></span> <b id="clsN">1</b>/<span id="clsT"></span> · <span data-t="score"></span>: <b id="clsScore">0</b></p>
<div class="eq" id="clsEq" style="font-size:28px;margin:22px 0"></div>
<div class="choices" id="clsChoices"></div>
<div class="msg" id="clsMsg"></div>
<div class="row"><button class="btn" id="clsNext" data-t="next"></button></div>
</div>
<div class="card"><h2 data-t="schemaH"></h2><div id="schema" class="schema"></div></div>
<div class="card"><h2 data-t="algoH"></h2><ol id="algo" style="margin:0;padding-left:22px"></ol><p class="hint" data-t="dual"></p></div>
</section>
</main>

<script>
let LANG='mn';try{const q=new URLSearchParams(location.search).get('lang');LANG=q==='en'||q==='mn'?q:(localStorage.getItem('chemLang')||'mn')}catch(e){}
const I={
mn:{title:'Химийн урвалын лаборатори',sub:'Химийн урвал, түүний төрөл · хосоороо эсвэл ганцаараа ажиллана',tab1:'1. Симуляци',tab2:'2. Тэгшитгэл тэнцүүлэх',tab3:'3. Урвал ангилах',
 simH:'Атомууд хэрхэн дахин холбогддог вэ?',play:'▶ Тоглуулах',reset:'↺ Эхнээс нь',stateKey:'Төлөв: (s) хатуу · (l) шингэн · (g) хий · (aq) усан уусмал',
 countH:'Атомын тоо: урвалын өмнө ба дараа',massLaw:'Атом шинээр үүсэхгүй, устахгүй, зөвхөн дахин холбогдоно. Иймээс эх бодисын масс бүтээгдэхүүн бодисын масстай тэнцүү (массын хадгалагдах хууль).',
 balH:'Коэффициент тавьж тэгшитгэлийг тэнцүүл',check:'Шалгах',solution:'Алхамчилсан бодолт',restart:'↺ Дахин эхлэх',clsH:'Энэ ямар төрлийн урвал вэ?',question:'Асуулт',score:'Оноо',next:'Дараагийнх →',
 schemaH:'Бүдүүвч',algoH:'Санамж: ангилах алгоритм',dual:'Зарим урвал хоёр төрөлд зэрэг хамаарна: 2Mg(s) + O₂(g) → 2MgO(s) нь нэгдэх ба шатах урвал.',
 react:'Эх бодис',prod:'Бүтээгдэхүүн бодис',el:'Элемент',before:'Урвалын өмнө',after:'Урвалын дараа',eqOk:'тэнцүү ✓',eqNo:'тэнцүү биш',left:'Эх бодис (зүүн тал)',rightCol:'Бүтээгдэхүүн бодис (баруун тал)',status:'Төлөв',
 balanced:'Тэгшитгэл тэнцүү байна.',coefAdded:'Коэффициент нэмэгдлээ, одоо тэгшитгэл тэнцүү.',reacting:'Коэффициент тавьсны дараа атом бүр хүрэлцэж, урвал явагдана.',pressPlay:' «Тоглуулах» дарж коэффициент нэмэгдэхийг хар.',
 ok:'Зөв! Тэгшитгэл тэнцүүлэгдлээ.',div:g=>'Тэнцүү боловч коэффициентүүдийг '+g+'-д хувааж хамгийн бага бүхэл тоонд шилжүүл.',no:'Тэнцүү биш байна. Хүснэгтийн улаан мөрийг хараад коэффициентээ өөрчил.',answer:'Хариу',
 right:'Зөв! ',wrong:'Буруу. Зөв хариу: ',done:s=>'Дууслаа! Таны оноо: '+s,again:'Дахин эхлэхийн тулд «Дараагийнх» товчийг дар.',
 types:['Нэгдэх','Задрах','Орлох','Солилцох','Шатах'],
 algo:['<b>Нэг</b> эх бодисоос хэд хэдэн бүтээгдэхүүн бодис үүсэв үү? → <b>задрах</b>','Эх бодис <b>O₂</b>-той урвалд орж, дулаан, гэрэл ялгарч, оксид үүсэв үү? → <b>шатах</b>','Хэд хэдэн эх бодисоос <b>нэг</b> бүтээгдэхүүн бодис үүсэв үү? → <b>нэгдэх</b>','<b>Дан бодис + нийлмэл бодис</b> → шинэ дан бодис + шинэ нийлмэл бодис уу? → <b>орлох</b>','<b>Хоёр нийлмэл бодис</b> бүрэлдэхүүн хэсгээ солилцов уу? → <b>солилцох</b>']},
en:{title:'Chemical Reactions Lab',sub:'Chemical reactions and their types · work in pairs or alone',tab1:'1. Simulation',tab2:'2. Balancing equations',tab3:'3. Classifying reactions',
 simH:'How do atoms rearrange?',play:'▶ Play',reset:'↺ Reset',stateKey:'State symbols: (s) solid · (l) liquid · (g) gas · (aq) aqueous solution',
 countH:'Number of atoms: before and after the reaction',massLaw:'Atoms are not created or destroyed, only rearranged. So the mass of the reactants equals the mass of the products (law of conservation of mass).',
 balH:'Balance the equation using coefficients',check:'Check',solution:'Step-by-step solution',restart:'↺ Start again',clsH:'What type of reaction is this?',question:'Question',score:'Score',next:'Next →',
 schemaH:'General patterns',algoH:'Hint: how to classify',dual:'Some reactions belong to two types: 2Mg(s) + O₂(g) → 2MgO(s) is both combination and combustion.',
 react:'Reactants',prod:'Products',el:'Element',before:'Before',after:'After',eqOk:'equal ✓',eqNo:'not equal',left:'Reactants (left)',rightCol:'Products (right)',status:'Status',
 balanced:'The equation is balanced.',coefAdded:'A coefficient was added; the equation is now balanced.',reacting:'With the coefficient in place every atom has a partner and the reaction happens.',pressPlay:' Press «Play» to see the coefficient added.',
 ok:'Correct! The equation is balanced.',div:g=>'Balanced, but divide all coefficients by '+g+' to get the smallest whole numbers.',no:'Not balanced yet. Look at the red rows and change the coefficients.',answer:'Answer',
 right:'Correct! ',wrong:'Not quite. Correct answer: ',done:s=>'Finished! Your score: '+s,again:'Press «Next» to start again.',
 types:['Combination','Decomposition','Displacement','Double displacement','Combustion'],
 algo:['Does <b>one</b> reactant give several products? → <b>decomposition</b>','Does a substance react with <b>O₂</b>, giving heat, light and oxides? → <b>combustion</b>','Do several reactants give <b>one</b> product? → <b>combination</b>','<b>Element + compound</b> → new element + new compound? → <b>displacement</b>','Do <b>two compounds</b> swap partners? → <b>double displacement</b>']}};
const T=k=>I[LANG][k];
const ST={'хат':'s','ш':'l','х':'g','уус':'aq'};
const loc=s=>s.replace(/\((хат|ш|х|уус)\)/g,(m,a)=>'('+ST[a]+')');
const fmt=s=>loc(s).replace(/→\{([^}]*)\}/g,'<span class="arw"><small>$1</small>→</span>').replace(/\((хат|ш|х|уус|s|l|g|aq)\)/g,'<span class="st">($1)</span>');

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-selected',String(x===b))});
  ['sim','bal','cls'].forEach(t=>document.getElementById('tab-'+t).classList.toggle('hidden',t!==b.dataset.tab));});

// ---------- simulation ----------
const EL={H:{c:'#F3F1EA',s:'#8A8778',r:16},O:{c:'#E0453A',s:'#9E2A22',r:22},Mg:{c:'#9AA8B8',s:'#5B6878',r:26},Ca:{c:'#7FB77E',s:'#477A46',r:28},C:{c:'#3B3B3B',s:'#111',r:21},Zn:{c:'#8C9DC4',s:'#4E5F88',r:26},Cl:{c:'#6CCB5F',s:'#3A8A30',r:23},Na:{c:'#A77BCA',s:'#6E4891',r:26}};
const SIMS=[
 {t:0,eq:'2Mg(s) + O₂(g) → 2MgO(s)',atoms:[['Mg',60,150,470,150],['Mg',125,150,620,150],['O',245,150,527,150],['O',292,150,677,150]],m0:[[0],[1],[2,3]],m1:[[0,2],[1,3]],p0:[185],p1:[],extra:[1],eq0:'Mg(s) + O₂(g) → MgO(s)',why:{mn:'O₂-д 2 O атом байгаа ч MgO-д 1 O л орно, дахиад 1 Mg хэрэгтэй.',en:'O₂ has 2 O atoms but MgO holds only 1, so one more Mg is needed.'}},
 {t:1,eq:'CaCO₃(s) →{t°} CaO(s) + CO₂(g)',cond:'t°',atoms:[['Ca',95,180,470,150],['C',225,150,697,150],['O',225,95,642,150],['O',280,180,752,150],['O',170,180,530,150]],m0:[[0,4,1,2],[1,3]],m1:[[0,4],[2,1,3]],p0:[],p1:[588]},
 {t:2,eq:'Zn(s) + 2HCl(aq) → ZnCl₂(aq) + H₂(g)',atoms:[['Zn',55,150,515,150],['H',148,150,672,150],['Cl',194,150,462,150],['H',252,150,712,150],['Cl',298,150,568,150]],m0:[[0],[1,2],[3,4]],m1:[[2,0,4],[1,3]],p0:[103],p1:[622],extra:[3,4],eq0:'Zn(s) + HCl(aq) → ZnCl₂(aq) + H₂(g)',why:{mn:'ZnCl₂-д 2 Cl орно, HCl-д 1 л Cl байна, дахиад 1 HCl хэрэгтэй.',en:'ZnCl₂ needs 2 Cl but HCl has only 1, so one more HCl is needed.'}},
 {t:3,eq:'NaOH(aq) + HCl(aq) → NaCl(aq) + H₂O(l)',atoms:[['Na',50,150,458,150],['O',104,150,655,140],['H',146,150,612,172],['H',245,150,698,172],['Cl',292,150,512,150]],m0:[[0,1,2],[3,4]],m1:[[0,4],[2,1,3]],p0:[196],p1:[565]},
 {t:4,eq:'CH₄(g) + 2O₂(g) → CO₂(g) + 2H₂O(l)',atoms:[['C',85,150,490,150],['H',85,106,622,176],['H',85,194,680,176],['H',41,150,716,176],['H',129,150,778,176],['O',220,124,438,150],['O',220,176,651,134],['O',282,124,542,150],['O',282,176,748,134]],m0:[[1,0,2],[3,0,4],[5,6],[7,8]],m1:[[5,0,7],[1,6,2],[3,8,4]],p0:[172],p1:[590],extra:[7,8],eq0:'CH₄(g) + O₂(g) → CO₂(g) + H₂O(l)',why:{mn:'CO₂ ба 2H₂O-д нийт 4 O хэрэгтэй, O₂-д 2 л O байна, дахиад 1 O₂ хэрэгтэй.',en:'CO₂ and 2H₂O need 4 O in total but O₂ has only 2, so one more O₂ is needed.'}},
 {t:5,eq:'2H₂(g) + O₂(g) → 2H₂O(l)',atoms:[['H',50,150,462,174],['H',92,150,542,174],['H',145,150,602,174],['H',187,150,682,174],['O',265,150,502,136],['O',312,150,642,136]],m0:[[0,1],[2,3],[4,5]],m1:[[0,4,1],[2,5,3]],p0:[226],p1:[],extra:[2,3],eq0:'H₂(g) + O₂(g) → H₂O(l)',why:{mn:'O₂-оос 2 H₂O үүснэ, гэвч 1 H₂ хүрэлцэхгүй, дахиад 1 H₂ хэрэгтэй.',en:'O₂ makes 2 H₂O, but 1 H₂ is not enough, so one more H₂ is needed.'}}];
const SIMN={mn:['Нэгдэх','Задрах','Орлох','Солилцох','Шатах','Тэгшитгэл: 2H₂ + O₂'],en:['Combination','Decomposition','Displacement','Double displacement','Combustion','Balancing: 2H₂ + O₂']};
let si=0,simT=0,simAnim=null;const svg=document.getElementById('simSvg');
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,cl=v=>Math.max(0,Math.min(1,v));
function drawSim(){const S=SIMS[si],ex=S.extra||[];const fa=ex.length?cl(simT/0.25):1,ur=ex.length?cl((simT-0.3)/0.7):simT;const t=ease(ur),al=S.atoms.map((a,i)=>ex.includes(i)?fa:1);
 const bal=!ex.length||simT>=0.15;document.getElementById('simEq').innerHTML=fmt(bal?S.eq:S.eq0);
 const note=document.getElementById('simNote');note.className=bal?'ok':'bad';note.textContent=!ex.length?T('balanced'):(bal?(ur>0?T('reacting'):T('coefAdded')):S.why[LANG]+T('pressPlay'));
 let h='<rect width="800" height="300" rx="14" fill="#FBFAF6"/><line x1="338" y1="150" x2="378" y2="150" stroke="#16233B" stroke-width="5"/><polygon points="378,138 396,150 378,162" fill="#16233B"/>';
 if(S.cond)h+=`<text x="366" y="128" text-anchor="middle" font-size="22" font-weight="700" fill="#C2501D" font-family="Times New Roman">${S.cond}</text>`;
 h+=`<text x="180" y="262" text-anchor="middle" font-size="19" fill="#4A5872" font-family="Times New Roman">${T('react')}</text><text x="610" y="262" text-anchor="middle" font-size="19" fill="#4A5872" font-family="Times New Roman">${T('prod')}</text>`;
 const A=(a,x,y,o)=>{const e=EL[a[0]];return `<g opacity="${o.toFixed(2)}"><circle cx="${x}" cy="${y}" r="${e.r}" fill="${e.c}" stroke="${e.s}" stroke-width="3"/><text x="${x}" y="${y+6}" text-anchor="middle" font-size="${e.r>20?17:14}" font-weight="700" font-family="Arial" fill="${a[0]==='C'?'#fff':'#16233B'}">${a[0]}</text></g>`};
 let g='';S.m0.forEach(m=>{for(let i=0;i<m.length-1;i++){const a=S.atoms[m[i]],b=S.atoms[m[i+1]];g+=`<line x1="${a[1]}" y1="${a[2]}" x2="${b[1]}" y2="${b[2]}" stroke="#16233B" stroke-width="6" stroke-linecap="round" stroke-opacity="${Math.min(al[m[i]],al[m[i+1]]).toFixed(2)}"/>`}});
 S.p0.forEach(x=>g+=`<text x="${x}" y="161" text-anchor="middle" font-size="34" font-weight="700" fill="#16233B" font-family="Arial">+</text>`);
 S.atoms.forEach((a,i)=>g+=A(a,a[1],a[2],al[i]));h+=`<g opacity="${ur>0?0.45:1}">${g}</g>`;
 if(ex.length&&!bal)h+=`<text x="${S.atoms[ex[0]][1]}" y="${S.atoms[ex[0]][2]+8}" text-anchor="middle" font-size="40" font-weight="700" fill="#B03A2E" font-family="Arial">?</text>`;
 if(ur>0){const P=S.atoms.map(a=>[a[1]+(a[3]-a[1])*t,a[2]+(a[4]-a[2])*t]),op=Math.abs(ur-0.5)*2,wob=Math.sin(ur*Math.PI)*8;
  (ur<0.5?[]:S.p1).forEach(x=>h+=`<text x="${x}" y="161" text-anchor="middle" font-size="34" font-weight="700" fill="#16233B" fill-opacity="${op.toFixed(2)}" font-family="Arial">+</text>`);
  (ur<0.5?S.m0:S.m1).forEach(m=>{for(let i=0;i<m.length-1;i++){const a=P[m[i]],b=P[m[i+1]];h+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#16233B" stroke-width="6" stroke-opacity="${op.toFixed(2)}" stroke-linecap="round"/>`}});
  S.atoms.forEach((a,i)=>h+=A(a,P[i][0]+(i%2?wob:-wob)*0.4,P[i][1],1))}
 svg.innerHTML=h;}
function simTable(){const S=SIMS[si],c={};S.atoms.forEach(a=>c[a[0]]=(c[a[0]]||0)+1);

 {L:[['C₂H₅OH',{C:2,H:6,O:1},'ш'],['O₂',{O:2},'х']],R:[['CO₂',{C:1,O:2},'х'],['H₂O',{H:2,O:1},'ш']],ans:[1,3,2,3],mn:['C: 2 → CO₂-ийн өмнө 2.','H: 6 → H₂O-ийн өмнө 3.','O: баруун талд 4 + 3 = 7; спиртэд 1 O байгаа тул O₂-оос 6 → O₂-ийн өмнө 3.'],en:['C: 2 → 2 in front of CO₂.','H: 6 → 3 in front of H₂O.','O: 4 + 3 = 7 on the right; ethanol has 1 O, so 6 must come from O₂ → 3 in front of O₂.']},

let bi=0,coef=[];
const gcd=(a,b)=>b?gcd(b,a%b):a;
const all=B=>B.L.concat(B.R);
function terms(side,off){return side.map((t,i)=>`<span class="term"><span class="coef"><button data-i="${off+i}" data-d="-1">−</button><b>${coef[off+i]}</b><button data-i="${off+i}" data-d="1">+</button></span><span class="fx">${fmt(t[0]+'('+t[2]+')')}</span></span>`).join(' <span class="term">+</span> ')}
function counts(side,off){const c={};side.forEach((t,i)=>{for(const k in t[1])c[k]=(c[k]||0)+t[1][k]*coef[off+i]});return c}
function ansEq(B){const n=B.L.length,f=(t,i)=>(B.ans[i]>1?B.ans[i]:'')+t[0]+'('+t[2]+')';return fmt(B.L.map((t,i)=>f(t,i)).join(' + ')+(B.cond?' →{'+B.cond+'} ':' → ')+B.R.map((t,i)=>f(t,n+i)).join(' + '))}

 document.getElementById('balEq').innerHTML=terms(B.L,0)+' <span class="term">'+(B.cond?'<span class="arw"><small>'+B.cond+'</small>→</span>':'&nbsp;→&nbsp;')+'</span> '+terms(B.R,n);
 document.querySelectorAll('#balEq .coef button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;coef[i]=Math.max(1,Math.min(9,coef[i]+ +b.dataset.d));document.getElementById('balMsg').textContent='';drawBal()});
 const l=counts(B.L,0),r=counts(B.R,n),els=[...new Set([...Object.keys(l),...Object.keys(r)])];
 let h=`<tr><th>${T('el')}</th><th>${T('left')}</th><th>${T('rightCol')}</th><th>${T('status')}</th></tr>`;
 els.forEach(k=>{const ok=l[k]===r[k];h+=`<tr><td><b>${k}</b></td><td>${l[k]||0}</td><td>${r[k]||0}</td><td class="${ok?'ok':'bad'}">${ok?T('eqOk'):T('eqNo')}</td></tr>`});
 document.getElementById('balTable').innerHTML=h;
 document.getElementById('balSteps').innerHTML='<ol style="margin:0;padding-left:20px">'+B[LANG].map(s=>`<li>${s}</li>`).join('')+`<li><b>${T('answer')}:</b> ${ansEq(B)}</li></ol>`;}

 if(ok&&g===1){m.className='msg ok';m.textContent=T('ok')}else if(ok){m.className='msg bad';m.textContent=T('div')(g)}else{m.className='msg bad';m.textContent=T('no')}};

 const c=document.getElementById('clsChoices');c.innerHTML=T('types').map((t,i)=>`<button data-i="${i}">${t}<small>${sub(i)}</small></button>`).join('');
 c.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const i=+b.dataset.i,m=document.getElementById('clsMsg');q[1].forEach(k=>c.children[k].classList.add('right'));
  const ex=LANG==='mn'?q[2]:q[3];if(q[1].includes(i)){score++;m.className='msg ok';m.textContent=T('right')+ex}else{b.classList.add('wrong');m.className='msg bad';m.textContent=T('wrong')+q[1].map(k=>T('types')[k]).join(', ')+'. '+ex}
