name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read # to find an earlier Pages deployment that is stuck in progress (see the deploy job)

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Check the site course
        run: |
          case "${{ vars.VITE_SITE_COURSE }}" in
            ""|igcse|as|a) ;;
            *) echo "VITE_SITE_COURSE must be igcse, as or a"; exit 1 ;;
          esac
      - run: npm run build
        env:
          # One course per site, set as a repository variable (see README.md). Empty builds the full app.
          VITE_SITE_COURSE: ${{ vars.VITE_SITE_COURSE }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_TEACHER_EMAIL: ${{ secrets.VITE_TEACHER_EMAIL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # GitHub sometimes still counts an earlier Pages deployment as in progress and refuses the new one ("due to in progress
      # deployment"). Then the earlier ones still in progress are cancelled, and the deployment is tried once more.
      - name: Cancel an earlier deployment stuck in progress
        if: steps.deployment.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Pages status of each recent deployment (the Deployments list can say success while Pages still holds it)
          for sha in $(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=10" --jq '.[].sha' | sort -u); do
            [ "$sha" = "${{ github.sha }}" ] && continue
            status=$(gh api "repos/${{ github.repository }}/pages/deployments/$sha" --jq '.status' 2>/dev/null || true)
            echo "$sha: ${status:-unknown}"
            case "$status" in
              deployment_queued|deployment_in_progress|syncing_files|finished_file_sync|updating_pages|purging_cdn)
                echo "Cancelling the Pages deployment of $sha"
                gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" || true ;;
            esac
          done
          sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
